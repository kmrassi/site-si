<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TP6 · L'effort du pilote dépend-il des conditions de montage et de la position du safran ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F4; --sheet:#FFFFFF; --ink:#15324B; --ink2:#3E5568; --sea:#2C6E7F; --sea-l:#DCEBEC;
  --signal:#E9B10A; --signal-l:#FCF1C9; --port:#C2362B; --port-l:#F8DEDA; --star:#23865A; --star-l:#D8EFE3;
  --line:#CAD7D7; --muted:#6B7F8C;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;height:auto;display:block}
button{font-family:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
a{color:var(--sea)}

/* ---------- En-tête ---------- */
.top{background:var(--ink);color:#fff;padding:22px 20px 0;padding-top:calc(22px + env(safe-area-inset-top,0px))}
.top-in{max-width:980px;margin:0 auto;display:flex;gap:24px;align-items:center}
.top-txt{flex:1;min-width:0}
.tp-code{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--signal);margin:0 0 2px}
.top h1{font-family:var(--cond);font-weight:600;font-size:clamp(24px,3.4vw,34px);line-height:1.12;margin:0 0 6px}
.top .sub{margin:0;color:#B9C9D4;font-size:15px}
.clock{flex:none;width:118px;height:118px;position:relative}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.clock .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.clock .t{font-family:var(--cond);font-weight:700;font-size:26px;line-height:1}
.clock .s{font-size:12px;color:#B9C9D4;margin-top:3px}
.tabs{max-width:980px;margin:20px auto 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:transparent;border:0;color:#C8D6DF;padding:10px 16px 12px;border-radius:8px 8px 0 0;cursor:pointer;font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center}
.tab:hover:not(:disabled){color:#fff;background:rgba(255,255,255,.07)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.tab:disabled{opacity:.45;cursor:not-allowed}
.tab .cnt{font-family:var(--cond);font-size:13px;background:rgba(255,255,255,.14);border-radius:20px;padding:0 7px}
.tab[aria-selected="true"] .cnt{background:var(--sea-l);color:var(--sea)}
.tab .cnt.full{background:var(--star);color:#fff}

/* ---------- Barre de progression ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:980px;margin:0 auto;padding:10px 20px;display:flex;gap:16px;align-items:center;font-size:14px}
.prog{flex:1;height:8px;background:#DDE6E6;border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sea);width:0;transition:width .4s}
.prog.full i{background:var(--star)}
.bar .who{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38%}
.bar .mini-t{font-family:var(--cond);font-weight:700;font-size:16px;white-space:nowrap}
.bar .mini-t.warn{color:#9A7400}.bar .mini-t.late{color:var(--port)}

/* ---------- Contenu ---------- */
main{max-width:980px;margin:0 auto;padding:28px 20px 60px}
.panel{display:none}
.panel.on{display:block}
.col{max-width:760px}
.act-head{display:flex;gap:18px;align-items:flex-start;margin:0 0 24px}
.act-n{font-family:var(--cond);font-weight:700;font-size:76px;line-height:.82;color:var(--sea)}
.act-head h2{font-family:var(--cond);font-weight:600;font-size:30px;line-height:1.1;margin:4px 0 6px}
.act-head .dur{color:var(--muted);font-size:15px;margin:0}
h3{font-family:var(--cond);font-weight:600;font-size:23px;margin:34px 0 10px}
p{margin:0 0 14px}
.lead{font-size:19px}
figure{margin:18px 0 22px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px}
figure img{margin:0 auto;cursor:zoom-in;border-radius:4px}
figure.sm img{max-width:440px;width:100%}
figcaption{font-size:14px;color:var(--muted);margin-top:8px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two figure{margin:0}
.note{background:var(--sea-l);border-radius:10px;padding:14px 18px;margin:18px 0}
.note.key{background:var(--ink);color:#fff}
.note.key b{color:var(--signal)}
.note.warn{background:var(--signal-l)}
.note p:last-child,.note ul:last-child{margin-bottom:0}
.note h4{margin:0 0 6px;font-size:16px}
ul.plain{padding-left:20px;margin:0 0 14px}
ul.plain li{margin-bottom:4px}
.formula{font-family:var(--cond);font-size:21px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 14px;display:inline-block;margin:4px 0 12px}
table.data{border-collapse:collapse;width:100%;margin:10px 0 16px;font-size:15px;background:var(--sheet)}
table.data th,table.data td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.data th{background:#E9F0F0;font-weight:600}
.scroll-x{overflow-x:auto}

/* Plan des activités */
.plan{list-style:none;padding:0;margin:10px 0 24px;border-left:3px solid var(--line)}
.plan li{position:relative;padding:4px 0 14px 22px}
.plan li::before{content:"";position:absolute;left:-8px;top:10px;width:13px;height:13px;border-radius:50%;background:var(--paper);border:3px solid var(--sea)}
.plan b{display:block;font-family:var(--cond);font-size:19px;font-weight:600}
.plan span{color:var(--muted);font-size:15px}

/* Démarrage */
.start{background:var(--sheet);border:2px solid var(--ink);border-radius:14px;padding:22px;margin:28px 0}
.start h3{margin-top:0}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row label{flex:1 1 220px;display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px}
input[type=text],input[type=password],textarea,select{font:inherit;color:var(--ink);background:#fff;border:1.5px solid #AFC0C3;border-radius:8px;padding:9px 12px;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--sea);outline:none;box-shadow:0 0 0 3px var(--sea-l)}
input:disabled,textarea:disabled{background:#EEF2F2;color:var(--ink2)}
.btn{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:11px 20px;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){background:#0E2436}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.alt:hover{background:var(--sea-l)}
.btn.go{background:var(--signal);color:var(--ink)}
.btn.go:hover:not(:disabled){background:#D9A300}
.btn.sm{padding:7px 13px;font-size:15px}
.err{color:var(--port);font-weight:600;font-size:15px;min-height:1.4em;margin:8px 0 0}

/* Étapes logiciel */
.step{display:flex;gap:12px;align-items:flex-start;background:var(--sheet);border:1px dashed #9FB5B8;border-radius:10px;padding:10px 14px;margin:10px 0}
.step input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--star);flex:none}
.step label{cursor:pointer}
.step.done{border-style:solid;border-color:var(--star);background:#F3FAF6}
.step .tag{font-family:var(--cond);font-weight:600;color:var(--sea);font-size:14px;display:block}

/* Questions */
.q{position:relative;background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:18px 20px 18px 20px;margin:18px 0}
.q.ok{border-left-color:var(--sea)}
.q.flash{animation:flash 1.4s}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--signal)}100%{box-shadow:0 0 0 0 transparent}}
.q-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.q-num{flex:none;font-family:var(--cond);font-weight:700;font-size:17px;min-width:38px;height:30px;padding:0 8px;border-radius:15px;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;border:2px solid var(--line)}
.q.ok .q-num{background:var(--sea);border-color:var(--sea);color:#fff}
.q-p{flex:1}
.q-p p:last-child{margin-bottom:0}
.opt{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:center;border:1.5px solid #C4D2D4;border-radius:9px;padding:9px 14px;cursor:pointer;background:#fff}
.choice:hover{border-color:var(--sea)}
.choice input{accent-color:var(--sea);width:18px;height:18px;margin:0;flex:none}
.choice:has(input:checked){border-color:var(--sea);background:var(--sea-l);font-weight:600}
.choice:has(input:disabled){cursor:default}
.numrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.numrow input{max-width:200px}
.unit{font-family:var(--cond);font-weight:600;color:var(--ink2);font-size:18px}
.fields{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(120px,1fr) auto;gap:8px 12px;align-items:center}
.fields .fl{font-size:15px}
.fields .fsec{grid-column:1/-1;font-family:var(--cond);font-weight:600;font-size:18px;color:var(--sea);margin-top:8px;border-bottom:1px solid var(--line)}
.grid{border-collapse:collapse;width:100%;font-size:15px}
.grid td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.grid td:first-child{font-weight:600;padding-right:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1.5px solid #C4D2D4;border-radius:20px;padding:5px 13px;cursor:pointer;background:#fff;font-size:15px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);border-color:var(--ink);color:#fff}
.seg label:has(input:focus-visible){outline:3px solid var(--signal)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
details.hint{margin-top:12px}
details.hint summary{cursor:pointer;color:var(--sea);font-weight:600;font-size:15px;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.hint summary::-webkit-details-marker{display:none}
details.hint summary::before{content:"+";font-family:var(--cond);font-size:20px;line-height:1;width:20px;height:20px;border-radius:50%;background:var(--sea-l);display:inline-flex;align-items:center;justify-content:center}
details.hint[open] summary::before{content:"–"}
details.hint div{background:var(--signal-l);border-radius:8px;padding:10px 14px;margin-top:8px;font-size:15px}
details.res{background:var(--sheet);border:1px solid var(--line);border-radius:10px;margin:16px 0;padding:0 16px}
details.res summary{cursor:pointer;padding:12px 0;font-weight:600}
details.res[open]{padding-bottom:14px}

.act-foot{display:flex;justify-content:space-between;gap:10px;margin-top:34px;flex-wrap:wrap}

/* Correction */
.lockbox{background:var(--sheet);border:2px solid var(--ink);border-radius:14px;padding:24px;max-width:760px}
.lockbox h2{font-family:var(--cond);font-size:30px;margin:0 0 8px}
.missing{list-style:none;padding:0;margin:14px 0;display:flex;flex-wrap:wrap;gap:8px}
.missing button{background:var(--port-l);color:var(--port);border:0;border-radius:20px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:14px}
.score{display:flex;gap:22px;align-items:center;background:var(--ink);color:#fff;border-radius:14px;padding:18px 22px;margin:0 0 26px;flex-wrap:wrap}
.score .big{font-family:var(--cond);font-weight:700;font-size:52px;line-height:1;color:var(--signal)}
.score p{margin:0;color:#C8D6DF;font-size:15px}
.cq{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.cq-h{display:flex;gap:10px;align-items:baseline;margin-bottom:10px;flex-wrap:wrap}
.cq-h b{font-family:var(--cond);font-size:18px}
.cq-h .pr{flex:1;color:var(--ink2);font-size:15px;min-width:200px}
.cq .mine{background:#F4F7F7;border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:15px;white-space:pre-wrap}
.cq .mine .lab,.cq .sol .lab{display:block;font-family:var(--cond);font-weight:600;font-size:14px;color:var(--muted);margin-bottom:2px;white-space:normal}
.cq .sol{border-left:4px solid var(--star);padding:6px 0 6px 14px}
.cq .sol p:last-child{margin-bottom:0}
.v{display:inline-block;font-size:13px;font-weight:700;border-radius:20px;padding:2px 10px;white-space:nowrap}
.v.ok{background:var(--star-l);color:var(--star)}
.v.ko{background:var(--port-l);color:var(--port)}
.v.mid{background:var(--signal-l);color:#8A6800}
.v.na{background:#E6ECEC;color:var(--ink2)}
.selfev{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center;font-size:14px;color:var(--muted)}
.selfev button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:3px 11px;cursor:pointer;font-size:14px}
.selfev button.on.a{background:var(--star);border-color:var(--star);color:#fff}
.selfev button.on.b{background:var(--signal);border-color:var(--signal);color:var(--ink)}
.selfev button.on.c{background:var(--port);border-color:var(--port);color:#fff}
table.ct{border-collapse:collapse;width:100%;font-size:14px;margin:4px 0}
table.ct td,table.ct th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
table.ct th{color:var(--muted);font-weight:600}

/* Fenêtres */
.modal{position:fixed;inset:0;background:rgba(10,25,38,.62);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:14px;max-width:440px;width:100%;padding:24px}
.modal h3{margin:0 0 8px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.lb{position:fixed;inset:0;background:rgba(10,25,38,.9);display:none;align-items:center;justify-content:center;z-index:70;padding:20px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-height:94vh;max-width:96vw;background:#fff;border-radius:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;z-index:80;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

footer{max-width:980px;margin:0 auto;padding:0 20px 40px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px}
footer .sp{flex:1}
footer button{background:none;border:0;color:var(--ink2);text-decoration:underline;cursor:pointer;font-size:14px;padding:4px}
.timeup{background:var(--port);color:#fff;text-align:center;padding:10px;font-weight:600;display:none}
.timeup.on{display:block}

/* Widgets */
.widget{background:var(--sheet);border:2px solid var(--sea);border-radius:12px;padding:16px 18px;margin:20px 0}
.widget h4{font-family:var(--cond);font-size:20px;margin:0 0 4px}
.widget .ctl{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}
.widget .ctl label{flex:1 1 220px;font-size:15px}
.widget input[type=range]{width:100%;accent-color:var(--sea)}
.widget .read{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.widget .read div{background:var(--paper);border-radius:8px;padding:6px 12px;font-size:14px}
.widget .read b{font-family:var(--cond);font-size:20px;display:block}
.wsvg{width:100%;height:auto;display:block;background:#F7FAFA;border-radius:8px}
canvas.plot{width:100%;height:320px;display:block;background:#F7FAFA;border-radius:8px}

@media (max-width:640px){
  html,body{font-size:16px}
  .top-in{flex-direction:column;align-items:flex-start;gap:12px}
  .clock{width:92px;height:92px;position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px))}
  .top{position:relative}
  .top-txt{padding-right:100px}
  .clock .t{font-size:20px}
  .two{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr auto}
  .fields .fl{grid-column:1/-1;margin-top:6px}
  .act-n{font-size:56px}
  .bar .who{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .top .tabs,.bar,footer,.start,.act-foot,.modal,.lb,.toast,details.hint,.widget{display:none!important}
  .top{background:#fff;color:#000}.clock{display:none}
  .panel{display:block!important;page-break-before:always}
  .panel#p-accueil{display:none!important}
  .q{break-inside:avoid}
  body,html{background:#fff}
}
</style>
</head>
<body>
<div class="timeup" id="timeup">Temps écoulé : tes réponses sont verrouillées. Appelle ton professeur.</div>
<header class="top">
  <div class="top-in">
    <div class="top-txt">
      <p class="tp-code" id="tpcode"></p>
      <h1 id="tptitle"></h1>
      <p class="sub" id="tpsub"></p>
    </div>
    <div class="clock" aria-live="off">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="8"/>
        <circle id="ring" cx="60" cy="60" r="52" fill="none" stroke="#E9B10A" stroke-width="8" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/>
      </svg>
      <div class="lbl"><span class="t" id="clockt">2:00</span><span class="s" id="clocks">à lancer</span></div>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<div class="bar"><div class="bar-in">
  <span class="who" id="who"></span>
  <div class="prog" id="prog"><i></i></div>
  <span id="progt">0 / 0</span>
  <span class="mini-t" id="minit"></span>
</div></div>
<main id="main"></main>
<footer>
  <button type="button" id="bPrint">Imprimer ma copie</button>
  <button type="button" id="bCopy">Copier mes réponses</button>
  <span class="sp"></span>
  <button type="button" id="bTeacher">Espace enseignant</button>
</footer>

<div class="modal" id="mPw" role="dialog" aria-modal="true" aria-labelledby="mPwT">
  <div class="box">
    <h3 id="mPwT">Validation par le professeur</h3>
    <p id="mPwMsg">Le professeur saisit le mot de passe pour afficher la correction. Tes réponses seront alors verrouillées.</p>
    <input type="password" id="pwIn" autocomplete="off" aria-label="Mot de passe enseignant">
    <p class="err" id="pwErr"></p>
    <div class="acts"><button class="btn alt" type="button" id="pwCancel">Annuler</button><button class="btn" type="button" id="pwOk">Valider</button></div>
  </div>
</div>
<div class="modal" id="mT" role="dialog" aria-modal="true" aria-labelledby="mTT">
  <div class="box">
    <h3 id="mTT">Espace enseignant</h3>
    <div id="tLogin">
      <input type="password" id="tIn" autocomplete="off" aria-label="Mot de passe enseignant">
      <p class="err" id="tErr"></p>
      <div class="acts"><button class="btn alt" type="button" data-close>Fermer</button><button class="btn" type="button" id="tOk">Entrer</button></div>
    </div>
    <div id="tMenu" hidden>
      <p>Copie de <b id="tWho"></b></p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn" type="button" id="tUnlock">Afficher la correction maintenant</button>
        <button class="btn alt" type="button" id="tPlus">Ajouter 10 minutes</button>
        <button class="btn alt" type="button" id="tReset">Effacer la copie et recommencer</button>
      </div>
      <div class="acts"><button class="btn alt" type="button" data-close>Fermer</button></div>
    </div>
  </div>
</div>
<div class="lb" id="lb"><img alt="" id="lbImg"></div>

 TP10 / TP22 / TP32.<\/li><\/ul><\/div>\n", "activites": [{"titre": "Simulation sur Méca3D d'une position quelconque", "duree": "Environ 50 min", "blocks": [{"t": "html", "html": "<p>Voici le schéma cinématique du pilote monté sur le bateau, avec un safran.<\/p>\n   <figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wgARCANbBEwDASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAQFAQMGAgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAezAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAxmnLdxW469yA6/PG9kAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAKG+oSbY11gZecnKdZyfWFVPoOgNoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAFDfUJt1xOnnKl221clJ1nF9pesTdtKAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPJ6VliegAAAAAAAAAAAAAAAAAAAAAAAHnnDpXKjqnKjqnKjqnKjqnKjqqGHXFn09NEnHpa7Rkou04mbevUuWL1Lkx1jkx1jkx1jkx1jlfZ07mB07mB07lsHVOVHVOVHVOVHVOVHVOd6IAAAAAAAAAAAAAAAAAAAa9miKHRbaqspPn0gKAAAAAAAAAMGUDbnpKYzrmAQfedy0bbZsaN9gIAAAAKQg3tdenl6Hl6Hl6Hl6Hl6Hmiv6RIl5zdpMXKmXpW9XxnaGGRhkYZGGRhkYZGGRhkeXoeXoeXoeXoeaudy5YdBjIAAAAAAAAAAAAAAAAAAAxnycT23M9MegAAAAAAAAAAY53fZc/XGj3a86a5pZ01M1bfG/PURreRj1Uvm7iyp/n108oXIAAA8Gjn4/XnrIAAAAAa6C1jTjrSzURLGmboybmgb2nBvaMm5oG9oybmgb2nBv3QPJaC9AAGHLmjrYVgAAAAAAAAAAAAAAAAAAAAAUl3SXYAAAAAAAAAA8+qzO4PQ11jOgb4eKLoKDn6r959dPKAAAxnTFfZ0t1Z7CgY5ab7LCUAAAAAAEH349znLF6AAAAAAAAAaoE+BOdoL0AEUhx67rjIAAABVFqqrVAUAAAAAAAAAAAAAACku6S7AAAAAAAAAAMc5e0fj9nQe8Z9njAVdpHz01Taa5UNcgAANWzIMZEKVyBK6fHoAAAAaoeic7DFFic71R+if6hSiY0+r02Y8YPfujsGLTNXaOoXQAAAAjpsr9Picb1T2jrsMXWOS3XRM9gAAAMGaW1q860dB59ayAAAAAAAAAAAAAAABSXdJdgAAAAADGfIcfZHQIU1GM6Ma1VlxT+f1349fjGqNvjVhqqvucu8emQjt+aQjiQjiQjjZQ5vMemglXNXLT9LQ3e+EtEXMtEEtHJIRxIxo1JBu6m2csMr0x42EgwrtMU1p6qkuIXjwu2dqy3V29NaJuF0AAeYBY0E3mSRZeZE5W6uXrP5y0r5zg4n+ygnWmwp7LdTnYKgW6oFuqBPqfN+zTx+hr5azoucuc+mWjt4kNO5AoAAAAAAAAAAAB4UxGn2eSrWlW     body=`<div class="numrow"><input type="text" inputmode="decimal" data-q="${id}" value="${esc(v||"")}" placeholder="${esc(q.placeholder||"ta valeur")}" aria-label="Réponse ${esc(q.num)}"><span class="unit">${q.unit||""}</span></div>`;
  }else if(q.type==="text"){
    body=`<textarea data-q="${id}" placeholder="${esc(q.placeholder||"Rédige ta réponse en quelques phrases…")}" aria-label="Réponse ${esc(q.num)}">${esc(v||"")}</textarea>`;
  }else if(q.type==="check"){
    body=`<label class="choice"><input type="checkbox" data-q="${id}" ${v===true?"checked":""}><span>${q.label||"C'est fait"}</span></label>`;
  }else if(q.type==="fields"){
    const vv=v||{};
    body=`<div class="fields">`+q.fields.map(f=>f.sec?`<div class="fsec">${f.sec}</div>`:`<label class="fl" for="${id}_${f.id}">${f.label}</label><input type="text" inputmode="decimal" id="${id}_${f.id}" data-q="${id}" data-f="${f.id}" value="${esc(vv[f.id]||"")}" placeholder="${esc(f.ph||"")}"><span class="unit">${f.unit||""}</span>`).join("")+`</div>`;
  }else if(q.type==="grid"){
    const vv=v||{};
    body=`<div class="scroll-x"><table class="grid">`+q.rows.map((r,ri)=>`<tr><td>${r.label}</td><td><div class="seg">`+r.options.map((o,oi)=>`<label><input type="radio" name="${id}_${ri}" data-q="${id}" data-r="${ri}" value="${oi}" ${vv[ri]===oi?"checked":""}>${o}</label>`).join("")+`</div></td></tr>`).join("")+`</table></div>`;
  }
  return `<div class="q${answered(q)?" ok":""}" id="q-${id}"><div class="q-h"><span class="q-num">${esc(q.num)}</span><div class="q-p">${q.prompt}${q.optional?`<span class="opt">facultatif</span>`:""}</div></div>${body}${q.hint?`<details class="hint"><summary>Coup de pouce</summary><div>${q.hint}</div></details>`:""}</div>`;
}
function renderBlock(b,ai){
  if(b.t==="html")return b.html;

  if(b.t==="step"){const sid=b.id,d=!!S.steps[sid];return `<div class="step${d?" done":""}"><input type="checkbox" id="st-${sid}" data-step="${sid}" ${d?"checked":""}><label for="st-${sid}"><span class="tag">${b.tag||"Sur le logiciel"}</span>${b.text}</label></div>`;}
  if(b.t==="widget")return `<div class="widget" id="w-${b.name}"></div>`;
  return "";
}
function startBox(){
  if(S.start)return `<div class="note"><p><b>Épreuve lancée.</b> Copie de ${esc(S.name)}${S.binome?" et "+esc(S.binome):""}. Bon travail !</p></div>`;
  return `<div class="start" id="startbox"><h3>Avant de commencer</h3><p>Écris ton nom puis lance l'épreuve. Le chronomètre de ${TP.duree/60} h démarre aussitôt et ne s'arrête plus. Tes réponses sont enregistrées automatiquement sur cet ordinateur.</p>

function buildPanels(){
  let h=`<section class="panel" id="p-accueil" role="tabpanel"><div class="col">${TP.accueil}${startBox()}</div></section>`;

    <div class="act-foot">${ai>0?`<button class="btn alt" type="button" data-go="a${ai}">Activité précédente</button>`:`<span></span>`}<button class="btn" type="button" data-go="${nx}">${nx==="corr"?"Terminer et demander la correction":"Activité suivante"}</button></div></div></section>`;

/* ===== Correction ===== */
function within(x,v,tol,rel){if(!isFinite(x))return false;return rel?Math.abs(x-v)<=Math.abs(v)*tol:Math.abs(x-v)<=tol;}
function evalFormula(f,vals){try{const ks=Object.keys(vals);return Function(...ks,"return ("+f+");")(...ks.map(k=>vals[k]));}catch(e){return NaN;}}
function gradeFields(q,g){
  const v=S.ans[q.id]||{},vals={};q.fields.forEach(f=>{if(!f.sec)vals[f.id]=num(v[f.id]);});
  let ok=0,tot=0;
  const rows=q.fields.map(f=>{
    if(f.sec)return `<tr><th colspan="4" style="color:var(--sea)">${f.sec}</th></tr>`;
    const c=g.f[f.id]||{},x=vals[f.id];let exp="—",ver=`<span class="v na">mesure</span>`;
    if(c.kind==="exact"){tot++;exp=fmt(c.v,6)+" "+(f.unit||"");if(within(x,c.v,c.tol,c.rel)){ok++;ver=`<span class="v ok">juste</span>`;}else ver=`<span class="v ko">à revoir</span>`;}
    else if(c.kind==="ref"){exp=`réf. prof : ${fmt(c.v)} ${f.unit||""}`;if(c.sign){tot++;if(isFinite(x)&&Math.sign(x)===c.sign){ok++;ver=`<span class="v ok">bon signe</span>`;}else ver=`<span class="v ko">signe ?</span>`;}}
    else if(c.kind==="calc"){tot++;const e=evalFormula(c.formula,vals);exp=`${fmt(e)} ${f.unit||""} <small>(d'après tes mesures)</small>`;if(within(x,e,c.tol||0.05,true)||within(x,e,0.05,false)){ok++;ver=`<span class="v ok">calcul juste</span>`;}else ver=`<span class="v ko">calcul à revoir</span>`;}
    return `<tr><td>${f.label}</td><td><b>${isFinite(x)?fmt(x,6)+" "+(f.unit||""):"—"}</b></td><td>${exp}</td><td>${ver}</td></tr>`;
  }).join("");
  return {ok,tot,html:`<div class="scroll-x"><table class="ct"><tr><th>Grandeur</th><th>Ta valeur</th><th>Attendu</th><th></th></tr>${rows}</table></div>`};
}
function buildCorr(){
  const P=$("#p-corr");
  if(!S.unlocked||!CORR){
    const miss=REQ.filter(q=>!answered(q));
    const can=miss.length===0||timeUp();
    P.innerHTML=`<div class="lockbox"><h2>Correction verrouillée</h2>
    ${!S.start?`<p>Lance d'abord l'épreuve depuis la page « Mise en situation ».</p>`:
      miss.length?`<p>Il te reste <b>${miss.length} question${miss.length>1?"s":""}</b> à traiter avant de pouvoir demander la correction :</p><ul class="missing">${miss.map(q=>`<li><button type="button" data-jump="${q.id}">Activité ${q.act+1} · Q${esc(q.num)}</button></li>`).join("")}</ul>`:
      `<p><b>Toutes les questions sont traitées.</b> Relis-toi, puis appelle ton professeur : il saisira le mot de passe pour afficher la correction. Après validation, tu ne pourras plus modifier tes réponses.</p>`}
    ${timeUp()&&miss.length?`<p>Le temps est écoulé : ton professeur peut afficher la correction.</p>`:""}
    <button class="btn go" type="button" id="bAsk" ${can&&S.start?"":"disabled"}>Faire valider par le professeur</button></div>`;
    return;
  }
  let ok=0,tot=0,out="";
  TP.activites.forEach((a,ai)=>{
    out+=`<h3>Activité ${ai+1} · ${a.titre}</h3>`;
    a.blocks.filter(b=>b.t==="q").forEach(q=>{
      const c=CORR.q[q.id]||{},g=c.grade||{type:"self"},v=S.ans[q.id];
      let mine="",ver="",extra="";
      if(q.type==="qcm"){mine=typeof v==="number"?q.options[v]:"—";if(g.type==="qcm"){tot++;if(v===g.ok){ok++;ver=`<span class="v ok">juste</span>`;}else ver=`<span class="v ko">à revoir</span>`;}}
      else if(q.type==="num"){mine=isFinite(num(v))?esc(v)+" "+(q.unit||""):"—";if(g.type==="num"){tot++;if(within(num(v),g.v,g.tol,g.rel)){ok++;ver=`<span class="v ok">juste</span>`;}else ver=`<span class="v ko">à revoir</span>`;}}
      else if(q.type==="text"){mine=v&&v.trim()?esc(v):"—";}
      else if(q.type==="check"){mine=v?"Fait":"Non fait";}
      else if(q.type==="fields"){const r=gradeFields(q,g);ok+=r.ok;tot+=r.tot;extra=r.html;const k=r.tot?`${r.ok}/${r.tot}`:"";ver=r.tot?`<span class="v ${r.ok===r.tot?"ok":r.ok?"mid":"ko"}">${k}</span>`:"";}
      else if(q.type==="grid"){const vv=v||{};let gk=0;extra=`<div class="scroll-x"><table class="ct"><tr><th></th><th>Ta réponse</th><th>Attendu</th><th></th></tr>`+q.rows.map((r,ri)=>{const good=g.ok&&vv[ri]===g.ok[ri];if(g.ok){tot++;if(good){ok++;gk++;}}return `<tr><td>${r.label}</td><td><b>${typeof vv[ri]==="number"?r.options[vv[ri]]:"—"}</b></td><td>${g.ok?r.options[g.ok[ri]]:""}</td><td>${g.ok?(good?`<span class="v ok">juste</span>`:`<span class="v ko">à revoir</span>`):""}</td></tr>`;}).join("")+`</table></div>`;ver=g.ok?`<span class="v ${gk===q.rows.length?"ok":gk?"mid":"ko"}">${gk}/${q.rows.length}</span>`:"";}
      const se=S.self[q.id];
      const selfUI=(q.type==="text")?`<div class="selfev">Auto-évaluation : <button type="button" class="a ${se==="a"?"on":""}" data-self="${q.id}" data-v="a">Acquis</button><button type="button" class="b ${se==="b"?"on":""}" data-self="${q.id}" data-v="b">En partie</button><button type="button" class="c ${se==="c"?"on":""}" data-self="${q.id}" data-v="c">À revoir</button></div>`:"";
      if(q.type==="text"&&!ver)ver=`<span class="v na">à comparer</span>`;
      out+=`<div class="cq"><div class="cq-h"><b>Q${esc(q.num)}</b><span class="pr">${q.short||""}</span>${ver}</div>
      ${extra?extra:`<div class="mine"><span class="lab">Ta réponse</span>${mine}</div>`}
      <div class="sol"><span class="lab">Correction</span>${c.html||""}</div>${selfUI}</div>`;
    });
    if(CORR.bilan&&CORR.bilan[ai])out+=`<div class="note">${CORR.bilan[ai]}</div>`;
  });
  P.innerHTML=`<div class="col"><div class="score"><span class="big">${ok}/${tot}</span><div><p><b style="color:#fff">Points vérifiés automatiquement</b></p><p>Les réponses rédigées sont à comparer avec la correction : utilise l'auto-évaluation sous chacune.</p><p>Copie de ${esc(S.name)}${S.binome?" et "+esc(S.binome):""}</p></div></div>${out}${CORR.fin?`<div class="note key">${CORR.fin}</div>`:""}</div>`;
}

/* ===== Chrono ===== */
let wasUp=false;
function tick(){
  const r=remaining(),tot=TP.duree*60+S.extra*60;
  const rr=Math.max(0,r),h=Math.floor(rr/3600),m=Math.floor(rr%3600/60),s=rr%60;
  const cm=Math.ceil(rr/60),txt=Math.floor(cm/60)+":"+String(cm%60).padStart(2,"0"),full=h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  $("#clockt").textContent=S.start?txt:(TP.duree/60)+" h";
  $("#clocks").textContent=!S.start?"à lancer":r<=0?"terminé":"restant";
  const frac=S.start?Math.max(0,r)/tot:1;
  const ring=$("#ring");ring.style.strokeDashoffset=String(326.7*(1-frac));
  ring.setAttribute("stroke",!S.start||r>1200?"#E9B10A":r>300?"#F08A24":"#E0483B");
  const mt=$("#minit");mt.textContent=S.start?(r>0?full:"0:00:00"):"";
  mt.className="mini-t"+(S.start&&r<=300?" late":S.start&&r<=1200?" warn":"");
  const up=!!timeUp();
  if(up!==wasUp){wasUp=up;applyLock();if(S.tab==="corr")buildCorr();if(up)toast("Temps écoulé");}
}

document.addEventListener("input",e=>{
  const el=e.target,qid=el.dataset.q;
  if(!qid||locked())return;
  const q=QS.find(x=>x.id===qid);
  if(q.type==="num"||q.type==="text")S.ans[qid]=el.value;
  else if(q.type==="fields"){S.ans[qid]=S.ans[qid]||{};S.ans[qid][el.dataset.f]=el.value;}
  save();mark(q);
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.step){if(locked()){el.checked=!el.checked;return;}S.steps[el.dataset.step]=el.checked;el.closest(".step").classList.toggle("done",el.checked);save();return;}
  const qid=el.dataset.q;if(!qid||locked())return;
  const q=QS.find(x=>x.id===qid);
  if(q.type==="qcm")S.ans[qid]=Number(el.value);
  else if(q.type==="check")S.ans[qid]=el.checked;
  else if(q.type==="grid"){S.ans[qid]=S.ans[qid]||{};S.ans[qid][el.dataset.r]=Number(el.value);}

document.addEventListener("click",e=>{

  if(t.dataset.self){S.self[t.dataset.self]=t.dataset.v;save();t.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===t));return;}
  if(t.id==="bStart"){const n=$("#inName").value.trim();if(n.length<2){$("#startErr").textContent="Écris ton nom et ton prénom pour commencer.";$("#inName").focus();return;}
    S.name=n;S.binome=$("#inBin").value.trim();S.start=Date.now();save();$("#startbox").outerHTML=startBox();refreshTabs();tick();show("a1");window.scrollTo({top:0});toast("Chronomètre lancé : "+TP.duree/60+" h");return;}
  if(t.id==="bAsk"){openPw();return;}

});

$("#bCopy").onclick=()=>{
  let t=`${TP.code} · ${TP.titre}\n${S.name}${S.binome?" & "+S.binome:""}\n`;
  TP.activites.forEach((a,ai)=>{t+=`\n=== Activité ${ai+1} : ${a.titre.replace(/<[^>]+>/g,"")} ===\n`;a.blocks.filter(b=>b.t==="q").forEach(q=>{const v=S.ans[q.id];let s="—";
    if(q.type==="qcm"&&typeof v==="number")s=q.options[v].replace(/<[^>]+>/g,"");
    else if(q.type==="num"&&v)s=v+" "+(q.unit||"");
    else if(q.type==="text"&&v)s=v;
    else if(q.type==="check")s=v?"fait":"non fait";
    else if(q.type==="fields"&&v)s=q.fields.filter(f=>!f.sec).map(f=>`${f.label.replace(/<[^>]+>/g,"")} = ${v[f.id]||"—"} ${f.unit||""}`).join(" ; ");
    else if(q.type==="grid"&&v)s=q.rows.map((r,i)=>`${r.label.replace(/<[^>]+>/g,"")} : ${typeof v[i]==="number"?r.options[v[i]]:"—"}`).join(" ; ");
    t+=`Q${q.num} : ${s}\n`;});});
  const done=()=>toast("Réponses copiées");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fallback(t));else fallback(t);
  function fallback(x){const ta=document.createElement("textarea");ta.value=x;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){toast("Copie impossible");}ta.remove();}
};
let tt=null;function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("on"),2200);}

/* ===== Widgets ===== */
const WIDGETS={};
WIDGETS.levier=function(root){
  root.innerHTML=`<h4>Visualiser : bras de levier et effort du pilote</h4>
  <p style="font-size:15px;margin:0 0 6px">Modèle simplifié, vu de dessus. La barre tourne autour de H ; le pilote, fixé en A, pousse la barre en G. L'effort du pilote est d'autant plus petit que son bras de levier par rapport à H est grand.</p>
  <div class="ctl"><label>Angle de barre : <b id="lvB">0°</b><input type="range" id="lvBeta" min="-30" max="30" step="1" value="0"></label>
  <label>Décalage du point d'ancrage A : <b id="lvO">0 mm</b><input type="range" id="lvOff" min="-200" max="200" step="10" value="0"></label></div>
  <div class="two"><svg class="wsvg" id="lvSvg" viewBox="0 0 380 300" role="img" aria-label="Schéma du pilote et de la barre"></svg>
  <svg class="wsvg" id="lvPlot" viewBox="0 0 320 300" role="img" aria-label="Courbe de l'effort du pilote"></svg></div>
  <div class="read"><div>Angle barre / pilote<b id="lvPhi"></b></div><div>Bras de levier<b id="lvD"></b></div><div>Effort du pilote<b id="lvF"></b></div><div>Écart max sur ±30°<b id="lvV"></b></div></div>`;
  const r=460,dA=600,s=0.36,Hx=300,Hy=215;
  const q=x=>root.querySelector(x);
  function geo(b,off){const br=b*Math.PI/180;const G={x:r*Math.sin(br),y:-r*Math.cos(br)};const A={x:-dA,y:-r+off};
    const ux=G.x-A.x,uy=G.y-A.y,L=Math.hypot(ux,uy);const d=Math.abs(G.x*uy-G.y*ux)/L;
    const cos=(G.x*ux+G.y*uy)/(r*L);return {G,A,L,d,phi:Math.acos(Math.max(-1,Math.min(1,cos)))*180/Math.PI,eff:r/d};}
  function draw(){
    const b=+q("#lvBeta").value,off=+q("#lvOff").value,g=geo(b,off);
    q("#lvB").textContent=b+"°";q("#lvO").textContent=(off>0?"+":"")+off+" mm";
    const P=p=>({x:Hx+p.x*s,y:Hy+p.y*s});const G=P(g.G),A=P(g.A);
    const ux=(G.x-A.x),uy=(G.y-A.y),bx=A.x+ux*.55,by=A.y+uy*.55;
    const br=b*Math.PI/180,Rx=Hx-Math.sin(br)*55,Ry=Hy+Math.cos(br)*55;
    q("#lvSvg").innerHTML=`<rect x="20" y="20" width="340" height="${Hy-20}" rx="10" fill="#E3ECEC"/>
    <line x1="20" y1="${Hy}" x2="360" y2="${Hy}" stroke="#15324B" stroke-width="3"/>
    <text x="28" y="40" font-size="13" fill="#3E5568">cockpit (vu de dessus)</text>
    <line x1="${Hx}" y1="${Hy}" x2="${Rx}" y2="${Ry}" stroke="#2C6E7F" stroke-width="10" stroke-linecap="round"/>
    <text x="${Rx+10}" y="${Ry+4}" font-size="13" fill="#2C6E7F">safran</text>
    <line x1="${Hx}" y1="${Hy}" x2="${G.x}" y2="${G.y}" stroke="#8A5A2B" stroke-width="8" stroke-linecap="round"/>
    <line x1="${A.x}" y1="${A.y}" x2="${bx}" y2="${by}" stroke="#15324B" stroke-width="14" stroke-linecap="round"/>
    <line x1="${bx}" y1="${by}" x2="${G.x}" y2="${G.y}" stroke="#7D8F99" stroke-width="5"/>
    <circle cx="${A.x}" cy="${A.y}" r="6" fill="#E9B10A" stroke="#15324B" stroke-width="2"/><text x="${A.x-6}" y="${A.y-12}" font-size="14" font-weight="700" fill="#15324B">A</text>
    <circle cx="${G.x}" cy="${G.y}" r="6" fill="#fff" stroke="#15324B" stroke-width="2"/><text x="${G.x+9}" y="${G.y-6}" font-size="14" font-weight="700" fill="#15324B">G</text>
    <circle cx="${Hx}" cy="${Hy}" r="7" fill="#15324B"/><text x="${Hx+10}" y="${Hy-8}" font-size="14" font-weight="700" fill="#15324B">H</text>
    <text x="${(A.x+bx)/2-20}" y="${(A.y+by)/2-14}" font-size="13" fill="#15324B">pilote</text>`;
    q("#lvPhi").textContent=g.phi.toFixed(0)+"°";q("#lvD").textContent=g.d.toFixed(0)+" mm";
    q("#lvF").textContent=Math.round(g.eff*100)+" % du mini";
    let pts=[],mx=1,mn=9;for(let k=-30;k<=30;k++){const e=geo(k,off).eff;pts.push([k,e]);mx=Math.max(mx,e);mn=Math.min(mn,e);}
    q("#lvV").textContent="+"+Math.round((mx/mn-1)*100)+" %";
    const top=Math.max(1.25,Math.ceil(mx*20)/20),X=k=>40+(k+30)/60*265,Y=e=>260-(e-1)/(top-1)*220;
    let grid="";for(let e=1;e<=top+1e-9;e+=0.05){grid+=`<line x1="40" x2="305" y1="${Y(e)}" y2="${Y(e)}" stroke="#D4DEDE"/><text x="34" y="${Y(e)+4}" font-size="11" text-anchor="end" fill="#6B7F8C">${Math.round(e*100)}%</text>`;}
    [-30,-15,0,15,30].forEach(k=>grid+=`<text x="${X(k)}" y="278" font-size="11" text-anchor="middle" fill="#6B7F8C">${k}°</text>`);
    q("#lvPlot").innerHTML=`<text x="40" y="22" font-size="13" fill="#15324B" font-weight="600">Effort du pilote (100 % = minimum)</text>${grid}
    <polyline fill="none" stroke="#2C6E7F" stroke-width="3" points="${pts.map(p=>X(p[0])+","+Y(p[1])).join(" ")}"/>
    <circle cx="${X(b)}" cy="${Y(g.eff)}" r="6" fill="#E9B10A" stroke="#15324B" stroke-width="2"/>
    <text x="172" y="296" font-size="12" text-anchor="middle" fill="#3E5568">angle de barre</text>`;
  }
  q("#lvBeta").addEventListener("input",draw);q("#lvOff").addEventListener("input",draw);draw();
};

WIDGETS.fem=function(root){
  root.innerHTML=`<h4>Outil : calculer E et tracer E = f(I)</h4>
  <p style="font-size:15px;margin:0 0 8px">Charge le fichier .csv de l'oscilloscope (ou colle son contenu). L'outil calcule E = U − R·I pour chaque point et trace la courbe. Tu peux aussi le faire dans le tableur, comme demandé.</p>
  <div class="ctl"><label>Fichier CSV<input type="file" id="feFile" accept=".csv,.txt"></label>
  <label>Résistance d'induit R (Ω)<input type="text" id="feR" value="0,8" inputmode="decimal"></label>
  <label>Sonde de courant (V par A)<input type="text" id="feK" value="0,1" inputmode="decimal"><small style="color:var(--muted)">Mets 1 si ta colonne est déjà en ampères.</small></label></div>
  <textarea id="feTxt" placeholder="…ou colle ici les lignes du fichier (temps ; voie 1 ; voie 2)" style="min-height:70px"></textarea>
  <div class="ctl"><label>Colonne de la tension U<select id="feU"></select></label><label>Colonne de la sonde de courant<select id="feI"></select></label></div>
  <button class="btn sm" type="button" id="feGo">Calculer et tracer</button> <span id="feInfo" style="font-size:14px;color:var(--muted);margin-left:8px"></span>
  <canvas class="plot" id="fePlot" style="margin-top:12px"></canvas>`;
  const q=x=>root.querySelector(x);let rows=[];
  const n=s=>Number(String(s).trim().replace(",","."));
  function parse(t){
    rows=[];t.split(/\r?\n/).forEach(l=>{if(!l.trim())return;let c=/[;\t]/.test(l)?l.split(/[;\t]/):l.split(",");c=c.map(n);if(c.length>=2&&c.every(x=>isFinite(x)))rows.push(c);});
    const nc=rows.length?rows[0].length:0;const opts=Array.from({length:nc},(_,i)=>`<option value="${i}">Colonne ${i+1}</option>`).join("");
    q("#feU").innerHTML=opts;q("#feI").innerHTML=opts;if(nc>=3){q("#feU").value="1";q("#feI").value="2";}else if(nc===2){q("#feU").value="0";q("#feI").value="1";}
    q("#feInfo").textContent=rows.length?rows.length+" points lus":"Aucune ligne de nombres trouvée.";
  }
  q("#feFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{q("#feTxt").value="";parse(String(rd.result));};rd.readAsText(f);});
  q("#feTxt").addEventListener("change",()=>parse(q("#feTxt").value));
  q("#feGo").addEventListener("click",()=>{
    if(!rows.length&&q("#feTxt").value)parse(q("#feTxt").value);
    if(!rows.length){q("#feInfo").textContent="Charge d'abord un fichier.";return;}
    const R=n(q("#feR").value),k=n(q("#feK").value)||1,iu=+q("#feU").value,ii=+q("#feI").value;
    const pts=rows.map(r=>{const I=r[ii]/k,U=r[iu];return [I,U-R*I];}).filter(p=>isFinite(p[0])&&isFinite(p[1]));
    plot(pts);q("#feInfo").textContent=pts.length+" points calculés · E de "+Math.min(...pts.map(p=>p[1])).toFixed(2).replace(".",",")+" à "+Math.max(...pts.map(p=>p[1])).toFixed(2).replace(".",",")+" V";
  });
  function plot(pts){
    const c=q("#fePlot"),dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);x.clearRect(0,0,w,h);
    let i0=Math.min(0,...pts.map(p=>p[0])),i1=Math.max(0,...pts.map(p=>p[0])),e0=Math.min(0,...pts.map(p=>p[1])),e1=Math.max(0,...pts.map(p=>p[1]));
    const pi=(i1-i0)*.05||1,pe=(e1-e0)*.05||1;i0-=pi;i1+=pi;e0-=pe;e1+=pe;
    const L=48,B=h-34,T=14,Rr=w-14,X=v=>L+(v-i0)/(i1-i0)*(Rr-L),Y=v=>B-(v-e0)/(e1-e0)*(B-T);
    x.font="12px Barlow, sans-serif";x.fillStyle="#6B7F8C";x.strokeStyle="#D4DEDE";
    const step=(a,b)=>{const r=(b-a)/6,p=Math.pow(10,Math.floor(Math.log10(r))),m=r/p;return (m<1.5?1:m<3?2:m<7?5:10)*p;};
    const si=step(i0,i1),se=step(e0,e1);
    for(let v=Math.ceil(i0/si)*si;v<=i1;v+=si){x.beginPath();x.moveTo(X(v),T);x.lineTo(X(v),B);x.stroke();x.fillText(+v.toFixed(2)+"",X(v)-8,B+16);}
    for(let v=Math.ceil(e0/se)*se;v<=e1;v+=se){x.beginPath();x.moveTo(L,Y(v));x.lineTo(Rr,Y(v));x.stroke();x.fillText(+v.toFixed(2)+"",6,Y(v)+4);}
    x.strokeStyle="#15324B";x.lineWidth=1.5;x.beginPath();x.moveTo(X(0),T);x.lineTo(X(0),B);x.moveTo(L,Y(0));x.lineTo(Rr,Y(0));x.stroke();
    x.fillStyle="#15324B";x.fillText("I (A)",Rr-30,B-6);x.fillText("E (V)",X(0)+6,T+10);
    x.fillStyle="rgba(44,110,127,.55)";pts.forEach(p=>{x.fillRect(X(p[0])-1.2,Y(p[1])-1.2,2.4,2.4);});
  }
};
