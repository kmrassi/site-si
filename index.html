<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sciences de l&#39;ingénieur — Ressources interactives</title>
<style>
:root{--bleu:#1e3a5f;--bleu2:#2f5d8f;--clair:#eef3f9;--fond:#f4f6f9;--txt:#1d2733;--gris:#6b7785;--ligne:#dfe5ec;--accent:#e8913a;
 --COURS:#1f4f8f;--COURSb:#e2ecfa;--TD:#1f7a3d;--TDb:#e5f5ea;--TP:#a65411;--TPb:#fdeedd;--SYNTHESE:#5f2f9a;--SYNTHESEb:#efe6fa;--CORRIGE:#a32a39;--CORRIGEb:#fbe4e6;--PROJET:#16727c;--PROJETb:#e0f4f6;--ETUDE:#7a5a00;--ETUDEb:#fdf3cf;--LOGICIEL:#334155;--LOGICIELb:#e2e8f0;--EVAL:#9d174d;--EVALb:#fce7f3;--EVALC:#a32a39;--EVALCb:#fbe4e6}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--txt);line-height:1.5}
a{color:inherit}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}

/* ---------- menu de gauche ---------- */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bleu);color:#fff;padding:18px 12px 24px;scrollbar-width:thin}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 14px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:12px;text-decoration:none}
.brand .logo{width:40px;height:40px;border-radius:11px;background:var(--accent);display:grid;place-items:center;font-size:1.3rem;flex:none}
.brand b{display:block;font-size:1.02rem}.brand span{font-size:.78rem;opacity:.75}
.search{width:100%;padding:8px 11px;border-radius:9px;border:0;font:inherit;font-size:.9rem;margin-bottom:10px}
.grp{font-size:.7rem;letter-spacing:1.2px;text-transform:uppercase;opacity:.6;font-weight:800;margin:14px 8px 6px}
.side nav a{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;text-decoration:none;font-size:.9rem;color:#e6edf6;margin-bottom:2px}
.side nav a i{font-style:normal;flex:none;min-width:34px;padding:0 4px;height:26px;border-radius:7px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:.78rem;font-weight:800}
.side nav a .t{flex:1;line-height:1.25}
.side nav a .c{font-size:.72rem;font-weight:700;background:var(--accent);color:#fff;border-radius:99px;padding:1px 7px}
.side nav a.vide{opacity:.55}
.side nav a:hover{background:rgba(255,255,255,.1)}
.side nav a.on{background:#fff;color:var(--bleu)}.side nav a.on i{background:var(--accent);color:#fff}
.menubtn{display:none}

/* ---------- contenu ---------- */
main{padding:28px 36px 60px;max-width:1100px;width:100%}
.hero{background:linear-gradient(135deg,var(--bleu),var(--bleu2));color:#fff;border-radius:18px;padding:26px 28px;margin-bottom:22px}
.hero .k{font-size:.78rem;letter-spacing:1.3px;text-transform:uppercase;opacity:.8;font-weight:700}
.hero h1{margin:4px 0 6px;font-size:clamp(1.5rem,3.5vw,2.1rem);line-height:1.2}
.hero p{margin:0;opacity:.9;max-width:720px}
.hero .num{display:inline-grid;place-items:center;min-width:54px;height:54px;border-radius:14px;background:var(--accent);font-weight:800;font-size:1.3rem;margin-bottom:10px;padding:0 10px}
h2{font-size:1.15rem;color:var(--bleu);margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.box{background:#fff;border:1px solid var(--ligne);border-radius:14px;padding:16px 18px}
.obj ul{margin:6px 0 0;padding-left:20px}.obj li{margin:3px 0}

/* parcours */
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.how div{background:#fff;border:1px solid var(--ligne);border-radius:14px;padding:14px;position:relative}
.how div b{display:block;margin:6px 0 2px}.how div p{margin:0;font-size:.88rem;color:var(--gris)}
.how .ico{font-size:1.5rem}
.how div:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:42%;color:var(--accent);font-weight:800;font-size:1.1rem}

/* cartes ressources */
.path{list-style:none;margin:0;padding:0;counter-reset:st}
.path li{display:grid;grid-template-columns:46px 1fr;gap:12px;position:relative;padding-bottom:12px}
.path li::before{counter-increment:st;content:counter(st);width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid var(--accent);display:grid;place-items:center;font-weight:800;color:var(--bleu);z-index:1}
.path li:not(:last-child)::after{content:"";position:absolute;left:19px;top:40px;bottom:0;width:3px;background:#f3d4b4}
.card{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--ligne);border-left:6px solid var(--c);border-radius:12px;padding:12px 16px;text-decoration:none;transition:.15s}
.card:hover{transform:translateX(3px);box-shadow:0 6px 16px rgba(30,58,95,.12)}
.card .ic{font-size:1.6rem;flex:none}
.card .bd{flex:1;min-width:0}
.card b{display:block;font-size:1.02rem}
.card .s{color:var(--gris);font-size:.87rem}
.card .go{flex:none;font-weight:700;color:var(--bleu2);font-size:.88rem;white-space:nowrap}
.tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.05em;padding:2px 8px;border-radius:10px;margin-right:6px;color:var(--c);background:var(--cb)}
.new{display:inline-block;font-size:.68rem;font-weight:800;background:var(--accent);color:#fff;border-radius:10px;padding:1px 7px;vertical-align:middle}
.empty{color:var(--gris);font-style:italic;background:#fff;border:1px dashed #cfd7e0;border-radius:12px;padding:14px 16px}
.theme{font-size:1.02rem;color:var(--bleu2);margin:20px 0 10px;padding:6px 12px;background:var(--clair);border-radius:9px;display:inline-block}
.also{margin-top:10px}.also a{font-weight:600;color:var(--bleu2)}
.legend{display:flex;flex-wrap:wrap;gap:8px}.legend span{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--ligne);border-radius:99px;padding:5px 12px;font-size:.86rem}
.seqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.seqgrid a{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--ligne);border-radius:12px;padding:10px 12px;text-decoration:none}
.seqgrid a:hover{border-color:var(--bleu2)}
.seqgrid a i{font-style:normal;flex:none;min-width:38px;height:32px;border-radius:9px;background:var(--clair);color:var(--bleu);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.seqgrid a small{display:block;color:var(--gris)}
.seqgrid a.vide{opacity:.55}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
.pn a{background:#fff;border:1px solid var(--ligne);border-radius:10px;padding:9px 14px;text-decoration:none;font-weight:600;color:var(--bleu);font-size:.9rem}
.pn a:hover{border-color:var(--bleu2)}
footer{text-align:center;color:var(--gris);font-size:.8rem;padding:24px}

@media(max-width:900px){
 .layout{grid-template-columns:minmax(0,1fr)}
 .side{position:sticky;top:0;height:auto;z-index:20;padding:10px 12px}
 .brand{border:0;margin:0;padding:0 4px}
 .menubtn{display:block;width:100%;margin-top:8px;border:0;border-radius:9px;padding:8px;font:inherit;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}
 .side .inner{display:none;max-height:65vh;overflow-y:auto;margin-top:8px}
 .side.open .inner{display:block}
 main{padding:18px 14px 40px}
 .how{grid-template-columns:1fr 1fr}.how div::after{display:none}
 .card .go{display:none}
}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const badge=s=>s.g?s.n:"S"+s.n;
const label=s=>s.g?s.t:"Séquence "+s.n+" — "+s.t;
const rk=k=>['LOGICIEL','EVAL','EVALC'].includes(k)?0:ORDRE.indexOf(k);
const sorted=p=>p.map((r,i)=>[r,i]).sort((a,b)=>rk(a[0][0])-rk(b[0][0])||a[1]-b[1]).map(x=>x[0]);

function card(r){const[k,a,b,h,nw]=r,ty=T[k];
 return `<a class="card" href="${h}" style="--c:var(--${k});--cb:var(--${k}b)"><span class="ic">${ty.i}</span><span class="bd"><span class="tag">${ty.l}</span>${nw?'<span class="new">NOUVEAU</span>':''}<b>${esc(a)}</b><span class="s">${esc(b)}</span></span><span class="go">Ouvrir →</span></a>`}

/* ===== menu ===== */
function buildNav(filter){
 const f=(filter||"").trim().toLowerCase();
 if(f){const hits=[];S.forEach(s=>s.p.forEach(r=>{if((r[1]+" "+r[2]+" "+s.t).toLowerCase().includes(f))hits.push([s,r])}));
  $('#nav').innerHTML=`<div class="grp">Résultats (${hits.length})</div>`+(hits.length?hits.map(([s,r])=>`<a href="${r[3]}"><i>${badge(s)}</i><span class="t">${T[r[0]].i} ${esc(r[1])}</span></a>`).join(''):'<div style="padding:6px 8px;opacity:.7;font-size:.88rem">Aucune ressource trouvée.</div>');return}
 const item=s=>`<a href="#${s.id}" data-id="${s.id}" class="${s.p.length?'':'vide'}"><i>${badge(s)}</i><span class="t">${esc(s.t)}</span>${s.p.length?`<span class="c">${s.p.length}</span>`:''}</a>`;
 $('#nav').innerHTML=`<a href="#accueil" data-id="accueil"><i>⌂</i><span class="t">Accueil</span></a>`+
  `<div class="grp">Séquences</div>`+S.filter(s=>!s.g).map(item).join('')+
  [...new Set(S.filter(s=>s.g).map(s=>s.g))].map(g=>`<div class="grp">${esc(g)}</div>`+S.filter(s=>s.g===g).map(item).join('')).join('');
 markNav()}
function markNav(){const id=(location.hash||'#accueil').slice(1);document.querySelectorAll('#nav a[data-id]').forEach(a=>a.classList.toggle('on',a.dataset.id===id))}

/* ===== vues ===== */
function home(){
 const tot=S.reduce((n,s)=>n+s.p.length,0),nouv=[];S.forEach(s=>s.p.forEach(r=>{if(r[4])nouv.push(r)}));
 return `<div class="hero"><div class="k">Cours · TD · TP · Synthèses</div><h1>Sciences de l'ingénieur</h1><p>${tot} ressources interactives classées par séquence. Choisis une séquence dans le menu de gauche, puis suis le parcours dans l'ordre.</p></div>
 <h2>🧭 Comment travailler une séquence ?</h2>
 <div class="how">${["COURS","TD","TP","SYNTHESE"].map(k=>`<div><span class="ico">${T[k].i}</span><b>${T[k].l}</b><p>${T[k].d}</p></div>`).join('')}</div>
 <p style="color:var(--gris);font-size:.9rem;margin:10px 2px 0">Dans les pages : essaie d'abord seul, utilise les <b>indices</b> si tu bloques, et n'ouvre la <b>correction</b> qu'après avoir répondu.</p>
 ${nouv.length?`<h2>✨ Nouveautés</h2><div style="display:grid;gap:10px">${nouv.map(card).join('')}</div>`:''}
 <h2>📚 Toutes les séquences</h2>
 <div class="seqgrid">${S.map(s=>`<a href="#${s.id}" class="${s.p.length?'':'vide'}"><i>${badge(s)}</i><span><b>${esc(s.t)}</b><small>${s.p.length?s.p.length+' ressource'+(s.p.length>1?'s':''):'bientôt'}</small></span></a>`).join('')}</div>
 <h2>🏷️ Légende</h2>
 <div class="legend">${ORDRE.map(k=>`<span>${T[k].i} <b style="color:var(--${k})">${T[k].l}</b> ${T[k].d.toLowerCase()}</span>`).join('')}</div>`}

function groups(p){const th=[...new Set(p.map(r=>r[5]||''))];
 if(th.length<2)return `<ol class="path">${sorted(p).map(r=>`<li>${card(r)}</li>`).join('')}</ol>`;
 return th.map(t=>`${t?`<h3 class="theme">${esc(t)}</h3>`:''}<ol class="path">${((t.startsWith('🧩')||t.startsWith('📝'))?(x=>x):sorted)(p.filter(r=>(r[5]||'')===t)).map(r=>`<li>${card(r)}</li>`).join('')}</ol>`).join('')}
function seqView(s){
 const i=S.indexOf(s),prev=S[i-1],next=S[i+1];
 return `<div class="hero"><div class="num">${badge(s)}</div><div class="k">${s.g?s.k:"Séquence "+s.n}</div><h1>${esc(s.t)}</h1></div>
 <div class="box obj"><b>🎯 Ce que tu vas apprendre</b><ul>${s.o.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
 <h2>🗺️ Parcours conseillé</h2>
 ${s.p.length?groups(s.p):`<div class="empty">Pas encore de page interactive pour cette séquence.</div>`}
 ${s.also?`<div class="box also"><b>🔗 Voir aussi</b><br>${s.also.map(([l,h])=>`<a href="${h}">${esc(l)}</a>`).join('<br>')}</div>`:''}
 <div class="pn">${prev?`<a href="#${prev.id}">← ${esc(label(prev))}</a>`:'<span></span>'}${next?`<a href="#${next.id}">${esc(label(next))} →</a>`:'<span></span>'}</div>`}

function route(){const id=(location.hash||'#accueil').slice(1),s=S.find(x=>x.id===id);
 $('#main').innerHTML=(s?seqView(s):home())+'<footer>Ressources SI — M\'RASSI</footer>';
 markNav();window.scrollTo(0,0);$('#side').classList.remove('open')}

$('#q').addEventListener('input',e=>buildNav(e.target.value));
$('#menubtn').addEventListener('click',()=>$('#side').classList.toggle('open'));
window.addEventListener('hashchange',route);
buildNav();route();
</script>
</body>
