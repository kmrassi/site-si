<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Séq. 2_b · TP B · Volant G27 : commander une rotation grâce aux équations horaires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F4; --sheet:#FFFFFF; --ink:#15324B; --ink2:#3E5568; --sea:#2C6E7F; --sea-l:#DCEBEC;
  --signal:#E9B10A; --signal-l:#FCF1C9; --port:#C2362B; --port-l:#F8DEDA; --star:#23865A; --star-l:#D8EFE3;
  --line:#CAD7D7; --muted:#6B7F8C;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;height:auto;display:block}
button{font-family:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
a{color:var(--sea)}

/* ---------- En-tête ---------- */
.top{background:var(--ink);color:#fff;padding:22px 20px 0;padding-top:calc(22px + env(safe-area-inset-top,0px))}
.top-in{max-width:980px;margin:0 auto;display:flex;gap:24px;align-items:center}
.top-txt{flex:1;min-width:0}
.tp-code{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--signal);margin:0 0 2px}
.top h1{font-family:var(--cond);font-weight:600;font-size:clamp(24px,3.4vw,34px);line-height:1.12;margin:0 0 6px}
.top .sub{margin:0;color:#B9C9D4;font-size:15px}
.clock{flex:none;width:118px;height:118px;position:relative}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.clock .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.clock .t{font-family:var(--cond);font-weight:700;font-size:26px;line-height:1}
.clock .s{font-size:12px;color:#B9C9D4;margin-top:3px}
.tabs{max-width:980px;margin:20px auto 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:transparent;border:0;color:#C8D6DF;padding:10px 16px 12px;border-radius:8px 8px 0 0;cursor:pointer;font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center}
.tab:hover:not(:disabled){color:#fff;background:rgba(255,255,255,.07)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.tab:disabled{opacity:.45;cursor:not-allowed}
.tab .cnt{font-family:var(--cond);font-size:13px;background:rgba(255,255,255,.14);border-radius:20px;padding:0 7px}
.tab[aria-selected="true"] .cnt{background:var(--sea-l);color:var(--sea)}
.tab .cnt.full{background:var(--star);color:#fff}

/* ---------- Barre de progression ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:980px;margin:0 auto;padding:10px 20px;display:flex;gap:16px;align-items:center;font-size:14px}
.prog{flex:1;height:8px;background:#DDE6E6;border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sea);width:0;transition:width .4s}
.prog.full i{background:var(--star)}
.bar .who{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38%}
.bar .mini-t{font-family:var(--cond);font-weight:700;font-size:16px;white-space:nowrap}
.bar .mini-t.warn{color:#9A7400}.bar .mini-t.late{color:var(--port)}

/* ---------- Contenu ---------- */
main{max-width:980px;margin:0 auto;padding:28px 20px 60px}
.panel{display:none}
.panel.on{display:block}
.col{max-width:760px}
.act-head{display:flex;gap:18px;align-items:flex-start;margin:0 0 24px}
.act-n{font-family:var(--cond);font-weight:700;font-size:76px;line-height:.82;color:var(--sea)}
.act-head h2{font-family:var(--cond);font-weight:600;font-size:30px;line-height:1.1;margin:4px 0 6px}
.act-head .dur{color:var(--muted);font-size:15px;margin:0}
h3{font-family:var(--cond);font-weight:600;font-size:23px;margin:34px 0 10px}
p{margin:0 0 14px}
.lead{font-size:19px}
figure{margin:18px 0 22px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px}
figure img{margin:0 auto;cursor:zoom-in;border-radius:4px}
img.ico{display:inline-block;height:30px;width:auto;vertical-align:middle;border-radius:5px;margin:0 3px}
figure.sm img{max-width:440px;width:100%}
figcaption{font-size:14px;color:var(--muted);margin-top:8px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two figure{margin:0}
.note{background:var(--sea-l);border-radius:10px;padding:14px 18px;margin:18px 0}
.note.key{background:var(--ink);color:#fff}
.note.key b{color:var(--signal)}
.note.warn{background:var(--signal-l)}
.note p:last-child,.note ul:last-child{margin-bottom:0}
.note h4{margin:0 0 6px;font-size:16px}
ul.plain{padding-left:20px;margin:0 0 14px}
ul.plain li{margin-bottom:4px}
.formula{font-family:var(--cond);font-size:21px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 14px;display:inline-block;margin:4px 0 12px}
table.data{border-collapse:collapse;width:100%;margin:10px 0 16px;font-size:15px;background:var(--sheet)}
table.data th,table.data td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.data th{background:#E9F0F0;font-weight:600}
.scroll-x{overflow-x:auto}

/* Plan des activités */
.plan{list-style:none;padding:0;margin:10px 0 24px;border-left:3px solid var(--line)}
.plan li{position:relative;padding:4px 0 14px 22px}
.plan li::before{content:"";position:absolute;left:-8px;top:10px;width:13px;height:13px;border-radius:50%;background:var(--paper);border:3px solid var(--sea)}
.plan b{display:block;font-family:var(--cond);font-size:19px;font-weight:600}
.plan span{color:var(--muted);font-size:15px}

/* Démarrage */
.start{background:var(--sheet);border:2px solid var(--ink);border-radius:14px;padding:22px;margin:28px 0}
.start h3{margin-top:0}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row label{flex:1 1 220px;display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px}
input[type=text],input[type=password],textarea,select{font:inherit;color:var(--ink);background:#fff;border:1.5px solid #AFC0C3;border-radius:8px;padding:9px 12px;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--sea);outline:none;box-shadow:0 0 0 3px var(--sea-l)}
input:disabled,textarea:disabled{background:#EEF2F2;color:var(--ink2)}
.btn{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:11px 20px;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){background:#0E2436}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.alt:hover{background:var(--sea-l)}
.btn.go{background:var(--signal);color:var(--ink)}
.btn.go:hover:not(:disabled){background:#D9A300}
.btn.sm{padding:7px 13px;font-size:15px}
.err{color:var(--port);font-weight:600;font-size:15px;min-height:1.4em;margin:8px 0 0}

/* Étapes logiciel */
.step{display:flex;gap:12px;align-items:flex-start;background:var(--sheet);border:1px dashed #9FB5B8;border-radius:10px;padding:10px 14px;margin:10px 0}
.step input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--star);flex:none}
.step label{cursor:pointer}
.step.done{border-style:solid;border-color:var(--star);background:#F3FAF6}
.step .tag{font-family:var(--cond);font-weight:600;color:var(--sea);font-size:14px;display:block}

/* Questions */
.q{position:relative;background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:18px 20px 18px 20px;margin:18px 0}
.q.ok{border-left-color:var(--sea)}
.q.flash{animation:flash 1.4s}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--signal)}100%{box-shadow:0 0 0 0 transparent}}
.q-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.q-num{flex:none;font-family:var(--cond);font-weight:700;font-size:17px;min-width:38px;height:30px;padding:0 8px;border-radius:15px;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;border:2px solid var(--line)}
.q.ok .q-num{background:var(--sea);border-color:var(--sea);color:#fff}
.q-p{flex:1}
.q-p p:last-child{margin-bottom:0}
.opt{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:center;border:1.5px solid #C4D2D4;border-radius:9px;padding:9px 14px;cursor:pointer;background:#fff}
.choice:hover{border-color:var(--sea)}
.choice input{accent-color:var(--sea);width:18px;height:18px;margin:0;flex:none}
.choice:has(input:checked){border-color:var(--sea);background:var(--sea-l);font-weight:600}
.choice:has(input:disabled){cursor:default}
.numrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.numrow input{max-width:200px}
.unit{font-family:var(--cond);font-weight:600;color:var(--ink2);font-size:18px}
.fields{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(120px,1fr) auto;gap:8px 12px;align-items:center}
.fields .fl{font-size:15px}
.fields .fsec{grid-column:1/-1;font-family:var(--cond);font-weight:600;font-size:18px;color:var(--sea);margin-top:8px;border-bottom:1px solid var(--line)}
.grid{border-collapse:collapse;width:100%;font-size:15px}
.grid td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.grid td:first-child{font-weight:600;padding-right:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1.5px solid #C4D2D4;border-radius:20px;padding:5px 13px;cursor:pointer;background:#fff;font-size:15px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);border-color:var(--ink);color:#fff}
.seg label:has(input:focus-visible){outline:3px solid var(--signal)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
details.hint{margin-top:12px}
details.hint summary{cursor:pointer;color:var(--sea);font-weight:600;font-size:15px;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.hint summary::-webkit-details-marker{display:none}
details.hint summary::before{content:"+";font-family:var(--cond);font-size:20px;line-height:1;width:20px;height:20px;border-radius:50%;background:var(--sea-l);display:inline-flex;align-items:center;justify-content:center}
details.hint[open] summary::before{content:"–"}
details.hint div{background:var(--signal-l);border-radius:8px;padding:10px 14px;margin-top:8px;font-size:15px}
details.res{background:var(--sheet);border:1px solid var(--line);border-radius:10px;margin:16px 0;padding:0 16px}
details.res summary{cursor:pointer;padding:12px 0;font-weight:600}
details.res[open]{padding-bottom:14px}

.act-foot{display:flex;justify-content:space-between;gap:10px;margin-top:34px;flex-wrap:wrap}

/* Correction */
.lockbox{background:var(--sheet);border:2px solid var(--ink);border-radius:14px;padding:24px;max-width:760px}
.lockbox h2{font-family:var(--cond);font-size:30px;margin:0 0 8px}
.missing{list-style:none;padding:0;margin:14px 0;display:flex;flex-wrap:wrap;gap:8px}
.missing button{background:var(--port-l);color:var(--port);border:0;border-radius:20px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:14px}
.score{display:flex;gap:22px;align-items:center;background:var(--ink);color:#fff;border-radius:14px;padding:18px 22px;margin:0 0 26px;flex-wrap:wrap}
.score .big{font-family:var(--cond);font-weight:700;font-size:52px;line-height:1;color:var(--signal)}
.score p{margin:0;color:#C8D6DF;font-size:15px}
.cq{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.cq-h{display:flex;gap:10px;align-items:baseline;margin-bottom:10px;flex-wrap:wrap}
.cq-h b{font-family:var(--cond);font-size:18px}
.cq-h .pr{flex:1;color:var(--ink2);font-size:15px;min-width:200px}
.cq .mine{background:#F4F7F7;border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:15px;white-space:pre-wrap}
.cq .mine .lab,.cq .sol .lab{display:block;font-family:var(--cond);font-weight:600;font-size:14px;color:var(--muted);margin-bottom:2px;white-space:normal}
.cq .sol{border-left:4px solid var(--star);padding:6px 0 6px 14px}
.cq .sol p:last-child{margin-bottom:0}
.v{display:inline-block;font-size:13px;font-weight:700;border-radius:20px;padding:2px 10px;white-space:nowrap}
.v.ok{background:var(--star-l);color:var(--star)}
.v.ko{background:var(--port-l);color:var(--port)}
.v.mid{background:var(--signal-l);color:#8A6800}
.v.na{background:#E6ECEC;color:var(--ink2)}
.selfev{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center;font-size:14px;color:var(--muted)}
.selfev button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:3px 11px;cursor:pointer;font-size:14px}
.selfev button.on.a{background:var(--star);border-color:var(--star);color:#fff}
.selfev button.on.b{background:var(--signal);border-color:var(--signal);color:var(--ink)}
.selfev button.on.c{background:var(--port);border-color:var(--port);color:#fff}
table.ct{border-collapse:collapse;width:100%;font-size:14px;margin:4px 0}
table.ct td,table.ct th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
table.ct th{color:var(--muted);font-weight:600}

/* Fenêtres */
.modal{position:fixed;inset:0;background:rgba(10,25,38,.62);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:14px;max-width:440px;width:100%;padding:24px}
.modal h3{margin:0 0 8px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.lb{position:fixed;inset:0;background:rgba(10,25,38,.9);display:none;align-items:center;justify-content:center;z-index:70;padding:20px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-height:94vh;max-width:96vw;background:#fff;border-radius:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;z-index:80;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

footer{max-width:980px;margin:0 auto;padding:0 20px 40px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px}
footer .sp{flex:1}
footer button{background:none;border:0;color:var(--ink2);text-decoration:underline;cursor:pointer;font-size:14px;padding:4px}
.timeup{background:var(--port);color:#fff;text-align:center;padding:10px;font-weight:600;display:none}
.timeup.on{display:block}

/* Widgets */
.widget{background:var(--sheet);border:2px solid var(--sea);border-radius:12px;padding:16px 18px;margin:20px 0}
.widget h4{font-family:var(--cond);font-size:20px;margin:0 0 4px}
.widget .ctl{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}
.widget .ctl label{flex:1 1 220px;font-size:15px}
.widget input[type=range]{width:100%;accent-color:var(--sea)}
.widget .read{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.widget .read div{background:var(--paper);border-radius:8px;padding:6px 12px;font-size:14px}
.widget .read b{font-family:var(--cond);font-size:20px;display:block}
.wsvg{width:100%;height:auto;display:block;background:#F7FAFA;border-radius:8px}
canvas.plot{width:100%;height:320px;display:block;background:#F7FAFA;border-radius:8px}

@media (max-width:640px){
  html,body{font-size:16px}
  .top-in{flex-direction:column;align-items:flex-start;gap:12px}
  .clock{width:92px;height:92px;position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px))}
  .top{position:relative}
  .top-txt{padding-right:100px}
  .clock .t{font-size:20px}
  .two{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr auto}
  .fields .fl{grid-column:1/-1;margin-top:6px}
  .act-n{font-size:56px}
  .bar .who{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .top .tabs,.bar,footer,.start,.act-foot,.modal,.lb,.toast,details.hint,.widget{display:none!important}
  .top{background:#fff;color:#000}.clock{display:none}
  .panel{display:block!important;page-break-before:always}
  .panel#p-accueil{display:none!important}
  .q{break-inside:avoid}
  body,html{background:#fff}
}
</style>
</head>
<body>
<div class="timeup" id="timeup">Temps écoulé : tes réponses sont verrouillées. Appelle ton professeur.</div>
<header class="top">
  <div class="top-in">
    <div class="top-txt">
      <p class="tp-code" id="tpcode"></p>
      <h1 id="tptitle"></h1>
      <p class="sub" id="tpsub"></p>
    </div>
    <div class="clock" aria-live="off">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="8"/>
        <circle id="ring" cx="60" cy="60" r="52" fill="none" stroke="#E9B10A" stroke-width="8" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/>
      </svg>
      <div class="lbl"><span class="t" id="clockt">2:00</span><span class="s" id="clocks">à lancer</span></div>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<div class="bar"><div class="bar-in">
  <span class="who" id="who"></span>
  <div class="prog" id="prog"><i></i></div>
  <span id="progt">0 / 0</span>
  <span class="mini-t" id="minit"></span>
</div></div>
<main id="main"></main>
<footer>
  <button type="button" id="bPrint">Imprimer ma copie</button>
  <button type="button" id="bCopy">Copier mes réponses</button>
  <span class="sp"></span>
  <button type="button" id="bTeacher">Espace enseignant</button>
</footer>

<div class="modal" id="mPw" role="dialog" aria-modal="true" aria-labelledby="mPwT">
  <div class="box">
    <h3 id="mPwT">Validation par le professeur</h3>
    <p id="mPwMsg">Le professeur saisit le mot de passe pour afficher la correction. Tes réponses seront alors verrouillées.</p>
    <input type="password" id="pwIn" autocomplete="off" aria-label="Mot de passe enseignant">
    <p class="err" id="pwErr"></p>
    <div class="acts"><button class="btn alt" type="button" id="pwCancel">Annuler</button><button class="btn" type="button" id="pwOk">Valider</button></div>
  </div>
</div>
<div class="modal" id="mT" role="dialog" aria-modal="true" aria-labelledby="mTT">
  <div class="box">
    <h3 id="mTT">Espace enseignant</h3>
    <div id="tLogin">
      <input type="password" id="tIn" autocomplete="off" aria-label="Mot de passe enseignant">
      <p class="err" id="tErr"></p>
      <div class="acts"><button class="btn alt" type="button" data-close>Fermer</button><button class="btn" type="button" id="tOk">Entrer</button></div>
    </div>
    <div id="tMenu" hidden>
      <p>Copie de <b id="tWho"></b></p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn" type="button" id="tUnlock">Afficher la correction maintenant</button>
        <button class="btn alt" type="button" id="tPlus">Ajouter 10 minutes</button>
        <button class="btn alt" type="button" id="tReset">Effacer la copie et recommencer</button>
      </div>
      <div class="acts"><button class="btn alt" type="button" data-close>Fermer</button></div>
    </div>
  </div>
</div>
<div class="lb" id="lb"><img alt="" id="lbImg"></div>

absence du joueur, le volant doit <b>revenir au centre<\/b> (position 0°). Une idée simple : alimenter les moteurs pendant une <b>durée calculée à l'avance<\/b>, sans capteur. C'est une commande en <b>boucle ouverte<\/b>.<\/p>\n<div class=\"note key\"><p><b>Problématique.<\/b> Les équations horaires du volant permettent-elles de calculer la durée de commande qui l'amène exactement à la position voulue ?<\/p><\/div>\n<div class=\"note\"><h4>Données<\/h4><ul class=\"plain\">\n<li>Chaque moteur entraîne la roue du volant par un pignon : pignon Z<sub>p<\/sub> = 11 dents, roue Z<sub>r<\/sub> = 180 dents. Donc ω<sub>moteur<\/sub> / ω<sub>volant<\/sub> = Z<sub>r<\/sub> / Z<sub>p<\/sub>.<\/li>\n<li>La commande des moteurs est un nombre PWM de 0 à 1023 : 1023 correspond à 24 V.<\/li>\n<li>Conversions : 1 tour = 360° = 2π rad ; 1 tr/min = 360°/60 s = 6 °/s.<\/li><\/ul><\/div>\n<details class=\"res\"><summary>Rappel : les équations horaires d'un mouvement de rotation<\/summary>\n<p>La position angulaire θ(t) joue le rôle de x(t), la vitesse angulaire ω(t) celui de v(t) et l'accélération angulaire α celui de a.<\/p>\n<div class=\"two\">\n<div class=\"note\"><h4>Rotation uniforme<\/h4><p>ω(t) = ω constante.<\/p><p class=\"formula\">θ(t) = ω·t + θ<sub>0<\/sub><\/p><p>La courbe θ(t) est une <b>droite<\/b> de pente ω.<\/p><\/div>\n<div class=\"note\"><h4>Rotation uniformément accélérée<\/h4><p>α constante.<\/p><p class=\"formula\">ω(t) = α·t + ω<sub>0<\/sub><\/p><p class=\"formula\">θ(t) = ½·α·t² + ω<sub>0<\/sub>·t + θ<sub>0<\/sub><\/p><\/div><\/div>\n<p style=\"font-size:15px\">Dans ce TP on garde les angles en degrés : θ en °, ω en °/s, α en °/s².<\/p>\n<\/details>\n<h3>Déroulement<\/h3>\n<ul class=\"plan\">\n<li><b>Activité 1 · Réponse à un échelon<\/b><span>Mesurer le mouvement du volant en boucle ouverte · environ 30 min<\/span><\/li>\n<li><b>Activité 2 · Équations horaires<\/b><span>Modèle en deux phases et comparaison avec la mesure · environ 35 min<\/span><\/li>\n<li><b>Act nit": "°/s"}, {"id": "ta", "label": "Temps pour atteindre 95 % de ω<sub>∞<\/sub> : t<sub>d<\/sub>", "unit": "s"}, {"id": "th15", "label": "Position du volant à t = 1,5 s", "unit": "°"}], "hint": "Pour ω<sub>∞<\/sub>, fais la moyenne de la vitesse une fois qu'elle est stable (zone jaune sur la fin). Puis calcule 0,95 × ω<sub>∞<\/sub> et cherche à quel instant la vitesse atteint cette valeur."}, {"t": "q", "id": "v1q3", "num": "3", "type": "qcm", "short": "Allure de la position en régime établi", "prompt": "<p>Une fois la vitesse stabilisée, la courbe de position θ(t) est :<\/p>", "options": ["une droite : θ augmente proportionnellement au temps", "une parabole", "constante"]}, {"t": "q", "id": "v1q4", "num": "4", "type": "num", "unit": "°/s", "short": "Pente de la position (vérification)", "prompt": "<p>Mesure la pente de la courbe de position sur la partie droite (outil : courbe Position volant, zone jaune sur la fin). Compare-la à ω<sub>∞<\/sub>.<\/p>"}, {"t": "q", "id": "v1q5", "num": "5", "type": "fields", "short": "Conversions et vitesse du moteur", "prompt": "<p>Convertis ω<sub>∞<\/sub>, puis calcule la vitesse de rotation des moteurs.<\/p>", "fields": [{"id": "w", "label": "ω<sub>∞<\/sub> (reprends ta valeur)", "unit": "°/s"}, {"id": "wr", "label": "ω<sub>∞<\/sub> en rad/s", "unit": "rad/s"}, {"id": "wt", "label": "ω<sub>∞<\/sub> en tr/min", "unit": "tr/min"}, {"id": "wm", "label": "Vitesse d'un moteur ω<sub>m<\/sub>", "unit": "rad/s"}], "hint": "rad/s = °/s × π/180. tr/min = °/s ÷ 6. ω<sub>m<\/sub> = ω<sub>volant<\/sub> × 180/11."}]}, {"titre": "Écrire et valider les équations horaires du volant", "duree": "Environ 35 min", "blocks": [{"t": "html", "html": "<p>On modélise le mouvement du volant par <b>deux phases<\/b> :<\/p>\n<ul class=\"plain\"><li><b>Phase 1<\/b> (0 ≤ t ≤ t<sub>d<\/sub>) : rotation uniformément accélérée, de ω = 0 à ω = ω<sub>∞<\/sub>.<\/li><li><b>Phase 2<\/b> (t ≥ t<sub>d<\/sub>) : rotation uniforme à ω<sub>∞<\/sub>.<\/li><\/ul>\n<p>On prend θ(0) = 0.<\/p>"}, {"t": "q", "id": "v2q1", "num": "6", "type": "fields", "short": "Paramètres du modèle en deux phases", "prompt": "<p>Avec tes valeurs de l'activité 1, calcule l'accélération angulaire de la phase 1 et l'angle parcouru pendant cette phase.<\/p>", "fields": [{"id": "w", "label": "ω<sub>∞<\/sub>", "unit": "°/s"}, {"id": "ta", "label": "t<sub>d<\/sub>", "unit": "s"}, {"id": "al", "label": "Accélération α = ω<sub>∞<\/sub> / t<sub>d<\/sub>", "unit": "°/s²"}, {"id": "th1", "label": "Angle à la fin de la phase 1 : θ(t<sub>d<\/sub>) = ½·α·t<sub>d<\/sub>²", "unit": "°"}]}, {"t": "q", "id": "v2q2", "num": "7", "type": "text", "short": "Équations horaires des deux phases", "prompt": "<p>Écris les équations horaires ω(t) et θ(t) pour chaque phase, avec tes valeurs numériques.<\/p>", "placeholder": "Phase 1 : ω(t) = …   θ(t) = …\nPhase 2 : ω(t) = …   θ(t) = …", "hint": "Phase 2 : le volant part de l'angle θ(t<sub>d<\/sub>) avec la vitesse ω<sub>∞<\/sub> : θ(t) = θ(t<sub>d<\/sub>) + ω<sub>∞<\/sub>·(t − t<sub>d<\/sub>)."}, {"t": "q", "id": "v2q3", "num": "8", "type": "fields", "short": "Prévision à 1,5 s et à 1 tour", "prompt": "<p>Utilise tes équations pour prévoir la position du volant à t = 1,5 s, puis l'instant où il a fait exactement 1 tour. Compare avec ta mesure.<\/p>", "fields": [{"id": "w", "label": "ω<sub>∞<\/sub>", "unit": "°/s"}, {"id": "ta", "label": "t<sub>d<\/sub>", "unit": "s"}, {"id": "thp", "label": "θ prévu à t = 1,5 s", "unit": "°"}, {"id": "thm", "label": "θ mesuré à t = 1,5 s", "unit": "°"}, {"id": "ec", "label": "Écart relatif |θ<sub>prévu<\/sub> − θ<sub>mesuré<\/sub>| / θ<sub>mesuré<\/sub> × 100", "unit": "%"}, {"id": "t360", "label": "Instant prévu pour 1 tour (360°)", "unit": "s"}]}, {"t": "widget", "name": "deuxphases", "titre": "Simulateur : comparer ton modèle à ta mesure", "intro": "Entre ω<sub>∞<\/sub> et t<sub>d<\/sub>. Tu peux superposer ta mesure ClientVolant (fichier .txt) en pointillés rouges.", "u": "°", "uv": "°/s", "ua": "°/s²", "V": "210", "td": "0,15", "cible": "360", "tmax": 2, "overlay": true, "fv": 0, "fx": 0, "fa": 0, "fx1": 1, "labX": "position θ (°)", "labCible": "Angle à atteindre", "labCibleCourt": "position", "need": ["v2q1", "v2q3"], "needLab": "6 et 8"}, {"t": "q", "id": "v2q4", "num": "9", "type": "qcm", "short": "Comparaison modèle / mesure", "prompt": "<p>Par rapport à la mesure, le modèle en deux phases prévoit un angle :<\/p>", "options": ["un peu plus petit (quelques degrés)", "beaucoup plus grand (plus de 50°)", "exactement le même"], "hint": "Le vrai démarrage est plus « arrondi » : la vitesse monte vite au début puis ralentit en approchant de ω<sub>∞<\/sub>. Le volant prend donc un peu d'avance sur le modèle à accélération constante."}, {"t": "q", "id": "v2q5", "num": "10", "type": "text", "short": "Validité du modèle", "prompt": "<p>Le modèle en deux phases est-il suffisant pour prévoir la position du volant ? Justifie avec l'écart calculé à la question 8.<\/p>"}]}, {"titre": "Commander une rotation de 180° en boucle ouverte", "duree": "Environ 45 min", "blocks": [{"t": "html", "html": "<p>On veut faire tourner le volant de <b>180°<\/b> en boucle ouverte, avec une PWM de 400, puis l'arrêter. Il faut calculer la <b>durée de commande t<sub>c<\/sub><\/b>.<\/p>\n<p>Attention : quand la commande s'arrête, le volant ne s'arrête pas instantanément. Il <b>ralentit<\/b> pendant une durée t<sub>f<\/sub> et tourne encore un peu.<\/p>\n<figure><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAGvAwUDASIAAhEBAxEB/8QAGwABAQEBAQEBAQAAAAAAAAAAAAIDBAUBBgj/xABREAABAwECCQYJCQcDBAEEAwABAAIDBBFyBRITITIzU7HRMUFRkZLBFBUiIzRSYXPSBjZCVHGTlbKzJDVDYnSBoWNl4RaCovCFRHWD8VXD0//EABkBAQEBAQEBAAAAAAAAAAAAAAACAQQDBf/EADYRAQABAwIEAwYEBQUBAAAAAAABAhEhAzEEEkFRBRNhIjJxgZGhQnKxwRQ0orLhM1Ji0fDC/9oADAMBA ∞<\/sub>·t<sub>f<\/sub>", "unit": "°"}], "hint": "Lis sur la courbe jaune l'instant où la vitesse commence à chuter, puis celui où elle s'annule."}, {"t": "q", "id": "v3q2", "num": "12", "type": "fields", "short": "Durée de commande pour 180° (PWM 400)", "prompt": "<p>Le volant doit s'arrêter à 180° : l'angle atteint à la fin de la commande, plus θ<sub>f<\/sub>, doit valoir 180°. Calcule la durée de commande t<sub>c<\/sub> (on suppose t<sub>c<\/sub> &gt; t<sub>d<\/sub>).<\/p>", "fields": [{"id": "w", "label": "ω<sub>∞<\/sub> (PWM 400)", "unit": "°/s"}, {"id": "ta", "label": "t<sub>d<\/sub>", "unit": "s"}, {"id": "tf", "label": "t<sub>f<\/sub>", "unit": "s"}, {"id": "thc", "label": "Angle à atteindre à la fin de la commande θ(t<sub>c<\/sub>) = 180 − θ<sub>f<\/sub>", "unit": "°"}, {"id": "tc", "label": "Durée de commande t<sub>c<\/sub>", "unit": "s"}], "hint": "Phase 2 : θ(t<sub>c<\/sub>) = ½·ω<sub>∞<\/sub>·t<sub>d<\/sub> + ω<sub>∞<\/sub>·(t<sub>c<\/sub> − t<sub>d<\/sub>). Isole t<sub>c<\/sub>."}, {"t": "step", "id": "c1", "text": "Crée un fichier texte <b>consigne_180.txt<\/b> sur le modèle de consigne_creneau.txt (une ligne = « temps PWM ») :<br><code>0 0<br>0.01 400<br>t<sub>c<\/sub> 400<br>t<sub>c<\/sub>+0.01 0<br>3 0<\/code><br>en remplaçant t<sub>c<\/sub> par ta valeur (point décimal).", "tag": "Sur le PC"}, {"t": "step", "id": "c2", "text": "Menu pilotage : type de consigne <b>Linéaire par morceaux<\/b>, ouvre ton fichier. Recentre le volant à 0°. Acquisition de 3 s (Position et Vitesse volant), lance la mesure sans toucher le volant.", "tag": "Dans ClientVolant"}, {"t": "q", "id": "v3q3", "num": "13", "type": "fields", "short": "Essai à PWM 400 : position finale", "prompt": "<p>Relève la position finale du volant et calcule l'écart avec 180°.<\/p>", "fields": [{"id": "thm", "label": "Position finale mesurée", "unit": "°"}, {"id": "e", "label": "Écart |θ<sub>final<\/sub> − 180|", "unit": "°"}]}, {"t": "q", "id": "v3q4", "num": "14", "type": "fields", "short": "Même calcul et même essai à PWM 600", "prompt": "<p>Recommence avec une PWM de <b>600<\/b>. Mesure d'abord ω<sub>∞<\/sub> avec un échelon de 600 (même méthode qu'à l'activité 1), garde t<sub>d<\/sub> et t<sub>f<\/sub>, recalcule t<sub>c<\/sub>, puis fais l'essai.<\/p>", "fields": [{"id": "w", "label": "ω<sub>∞<\/sub> (PWM 600)", "unit": "°/s"}, {"id": "ta", "label": "t<sub>d<\/sub>", "unit": "s"}, {"id": "tf", "label": "t<sub>f<\/sub>", "unit": "s"}, {"id": "tc", "label": "Durée de commande t<sub>c<\/sub>", "unit": "s"}, {"id": "thm", "label": "Position finale mesurée", "unit": "°"}, {"id": "e", "label": "Écart |θ<sub>final<\/sub> − 180|", "unit": "°"}]}, {"t": "q", "id": "v3q5", "num": "15", "type": "text", "short": "Limites de la commande en boucle ouverte", "prompt": "<p>Le volant s'arrête-t-il exactement à 180° ? Que se passerait-il si le volant ne partait pas de 0°, ou si le joueur le retenait un peu ? Conclus sur la commande en boucle ouverte pour le retour au centre.<\/p>"}, {"t": "q", "id": "v3q6", "num": "16", "type": "text", "short": "Synthèse : réponse à la problématique", "prompt": "<p><b>Synthèse.<\/b> En quelques lignes, réponds à la problématique. Quel élément faut-il ajouter au volant pour qu'il revienne toujours exactement au centre ?<\/p>"}]}, {"titre": "Pour aller plus loin : le retour au centre asservi", "duree": "Facultatif", "blocks": [{"t": "html", "html": "<p>Le vrai volant revient au centre grâce à un <b>asservissement<\/b> : un codeur mesure la position et la carte de commande corrige la tension des moteurs. On étudie une mesure d'exemple : le volant est tourné d'environ 190°, puis <b>lâché<\/b> (boucle fermée, correcteur proportionnel).<\/p>"}, {"t": "widget", "name": "mesure", "key": "mesure2", "titre": "Outil : mesure du retour au centre (lâcher)", "intro": "Clique sur « Charger la mesure d'exemple » (ou charge ta propre mesure). Choisis la courbe Position volant ou Vitesse volant et place la zone jaune.", "pref": "Position volant", "sample": "lacher", "za": 560, "zb": 720}, {"t": "q", "id": "v4q1", "num": "17", "type": "fields", "optional": true, "short": "Caractéristiques du retour au centre", "prompt": "<p>Relève sur la mesure d'exemple :<\/p>", "fields": [{"id": "t0", "label": "Instant où le volant est lâché", "unit": "s"}, {"id": "t1", "label": "Instant où il passe par 0°", "unit": "s"}, {"id": "wmax", "label": "Vitesse maximale (valeur absolue)", "unit": "°/s"}, {"id": "dep", "label": "Dépassement (angle le plus négatif)", "unit": "°"}, {"id": "thf", "label": "Position finale", "unit": "°"}]}, {"t": "q", "id": "v4q2", "num": "18", "type": "text", "optional": true, "short": "Équation horaire de la phase de retour", "prompt": "<p>Entre 3,00 s et 3,18 s, la courbe de position est presque une droite. Donne son équation horaire θ(t) (pente avec l'outil). Compare cette vitesse à celle obtenue en boucle ouverte avec la PWM 400. Qu'apporte la boucle fermée ?<\/p>"}]}]};

/* ===== Correction ===== */
function within(x,v,tol,rel){if(!isFinite(x))return false;return rel?Math.abs(x-v)<=Math.abs(v)*tol:Math.abs(x-v)<=tol;}
function A(qid,fid){const v=S.ans[qid];return fid?num(v&&v[fid]):num(v);}
function evalFormula(f,vals){try{const ks=Object.keys(vals);return Function("A",...ks,"return ("+f+");")(A,...ks.map(k=>vals[k]));}catch(e){return NaN;}}
function gradeFields(q,g){
  const v=S.ans[q.id]||{},vals={};q.fields.forEach(f=>{if(!f.sec)vals[f.id]=num(v[f.id]);});
  let ok=0,tot=0;
  const rows=q.fields.map(f=>{
    if(f.sec)return `<tr><th colspan="4" style="color:var(--sea)">${f.sec}</th></tr>`;
    const c=g.f[f.id]||{},x=vals[f.id];let exp="—",ver=`<span class="v na">mesure</span>`;
    if(c.kind==="exact"){tot++;exp=fmt(c.v,6)+" "+(f.unit||"");if(within(x,c.v,c.tol,c.rel)){ok++;ver=`<span class="v ok">juste</span>`;}else ver=`<span class="v ko">à revoir</span>`;}
    else if(c.kind==="ref"){exp=`réf. prof : ${fmt(c.v)} ${f.unit||""}`;if(c.sign){tot++;if(isFinite(x)&&Math.sign(x)===c.sign){ok++;ver=`<span class="v ok">bon signe</span>`;}else ver=`<span class="v ko">signe ?</span>`;}}
    else if(c.kind==="calc"){tot++;const e=evalFormula(c.formula,vals);exp=`${fmt(e)} ${f.unit||""} <small>(d'après tes mesures)</small>`;if(within(x,e,c.tol||0.05,true)||within(x,e,0.05,false)){ok++;ver=`<span class="v ok">calcul juste</span>`;}else ver=`<span class="v ko">calcul à revoir</span>`;}
    return `<tr><td>${f.label}</td><td><b>${isFinite(x)?fmt(x,6)+" "+(f.unit||""):"—"}</b></td><td>${exp}</td><td>${ver}</td></tr>`;
  }).join("");
  return {ok,tot,html:`<div class="scroll-x"><table class="ct"><tr><th>Grandeur</th><th>Ta valeur</th><th>Attendu</th><th></th></tr>${rows}</table></div>`};
}
function buildCorr(){
  const P=$("#p-corr");
  if(!S.unlocked||!CORR){
    const miss=REQ.filter(q=>!answered(q));
    const can=miss.length===0||timeUp();
    P.innerHTML=`<div class="lockbox"><h2>Correction verrouillée</h2>
    ${!S.start?`<p>Lance d'abord l'épreuve depuis la page « Mise en situation ».</p>`:
      miss.length?`<p>Il te reste <b>${miss.length} question${miss.length>1?"s":""}</b> à traiter avant de pouvoir demander la correction :</p><ul class="missing">${miss.map(q=>`<li><button type="button" data-jump="${q.id}">Activité ${q.act+1} · Q${esc(q.num)}</button></li>`).join("")}</ul>`:
      `<p><b>Toutes les questions sont traitées.</b> Relis-toi, puis appelle ton professeur : il saisira le mot de passe pour afficher la correction. Après validation, tu ne pourras plus modifier tes réponses.</p>`}
    ${timeUp()&&miss.length?`<p>Le temps est écoulé : ton professeur peut afficher la correction.</p>`:""}
    <button class="btn go" type="button" id="bAsk" ${can&&S.start?"":"disabled"}>Faire valider par le professeur</button></div>`;
    return;
  }
  let ok=0,tot=0,out="";
  TP.activites.forEach((a,ai)=>{
    out+=`<h3>Activité ${ai+1} · ${a.titre}</h3>`;
    a.blocks.filter(b=>b.t==="q").forEach(q=>{
      const c=CORR.q[q.id]||{},g=c.grade||{type:"self"},v=S.ans[q.id];
      let mine="",ver="",extra="";
      if(q.type==="qcm"){mine=typeof v==="number"?q.options[v]:"—";if(g.type==="qcm"){tot++;if(v===g.ok){ok++;ver=`<span class="v ok">juste</span>`;}else ver=`<span class="v ko">à revoir</span>`;}}
      else if(q.type==="num"){mine=isFinite(num(v))?esc(v)+" "+(q.unit||""):"—";if(g.type==="num"){tot++;if(within(num(v),g.v,g.tol,g.rel)){ok++;ver=`<span class="v ok">juste</span>`;}else ver=`<span class="v ko">à revoir</span>`;}}
      else if(q.type==="text"){mine=v&&v.trim()?esc(v):"—";}
      else if(q.type==="check"){mine=v?"Fait":"Non fait";}
      else if(q.type==="fields"){const r=gradeFields(q,g);ok+=r.ok;tot+=r.tot;extra=r.html;const k=r.tot?`${r.ok}/${r.tot}`:"";ver=r.tot?`<span class="v ${r.ok===r.tot?"ok":r.ok?"mid":"ko"}">${k}</span>`:"";}
      else if(q.type==="grid"){const vv=v||{};let gk=0;extra=`<div class="scroll-x"><table class="ct"><tr><th></th><th>Ta réponse</th><th>Attendu</th><th></th></tr>`+q.rows.map((r,ri)=>{const good=g.ok&&vv[ri]===g.ok[ri];if(g.ok){tot++;if(good){ok++;gk++;}}return `<tr><td>${r.label}</td><td><b>${typeof vv[ri]==="number"?r.options[vv[ri]]:"—"}</b></td><td>${g.ok?r.options[g.ok[ri]]:""}</td><td>${g.ok?(good?`<span class="v ok">juste</span>`:`<span class="v ko">à revoir</span>`):""}</td></tr>`;}).join("")+`</table></div>`;ver=g.ok?`<span class="v ${gk===q.rows.length?"ok":gk?"mid":"ko"}">${gk}/${q.rows.length}</span>`:"";}
      const se=S.self[q.id];
      const selfUI=(q.type==="text")?`<div class="selfev">Auto-évaluation : <button type="button" class="a ${se==="a"?"on":""}" data-self="${q.id}" data-v="a">Acquis</button><button type="button" class="b ${se==="b"?"on":""}" data-self="${q.id}" data-v="b">En partie</button><button type="button" class="c ${se==="c"?"on":""}" data-self="${q.id}" data-v="c">À revoir</button></div>`:"";
      if(q.type==="text"&&!ver)ver=`<span class="v na">à comparer</span>`;
      out+=`<div class="cq"><div class="cq-h"><b>Q${esc(q.num)}</b><span class="pr">${q.short||""}</span>${ver}</div>
      ${extra?extra:`<div class="mine"><span class="lab">Ta réponse</span>${mine}</div>`}
      <div class="sol"><span class="lab">Correction</span>${c.html||""}</div>${selfUI}</div>`;
    });
    if(CORR.bilan&&CORR.bilan[ai])out+=`<div class="note">${CORR.bilan[ai]}</div>`;
  });
  P.innerHTML=`<div class="col"><div class="score"><span class="big">${ok}/${tot}</span><div><p><b style="color:#fff">Points vérifiés automatiquement</b></p><p>Les réponses rédigées sont à comparer avec la correction : utilise l'auto-évaluation sous chacune.</p><p>Copie de ${esc(S.name)}${S.binome?" et "+esc(S.binome):""}</p></div></div>${out}${CORR.fin?`<div class="note key">${CORR.fin}</div>`:""}</div>`;
}

/* ===== Chrono ===== */
let wasUp=false;
function tick(){
  const r=remaining(),tot=TP.duree*60+S.extra*60;
  const rr=Math.max(0,r),h=Math.floor(rr/3600),m=Math.floor(rr%3600/60),s=rr%60;
  const cm=Math.ceil(rr/60),txt=Math.floor(cm/60)+":"+String(cm%60).padStart(2,"0"),full=h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  $("#clockt").textContent=S.start?txt:(TP.duree/60)+" h";
  $("#clocks").textContent=!S.start?"à lancer":r<=0?"terminé":"restant";
  const frac=S.start?Math.max(0,r)/tot:1;
  const ring=$("#ring");ring.style.strokeDashoffset=String(326.7*(1-frac));
  ring.setAttribute("stroke",!S.start||r>1200?"#E9B10A":r>300?"#F08A24":"#E0483B");
  const mt=$("#minit");mt.textContent=S.start?(r>0?full:"0:00:00"):"";
  mt.className="mini-t"+(S.start&&r<=300?" late":S.start&&r<=1200?" warn":"");
  const up=!!timeUp();
  if(up!==wasUp){wasUp=up;applyLock();if(S.tab==="corr")buildCorr();if(up)toast("Temps écoulé");}
}

const WIDGETS={};

/* ---------- Lecture d'une mesure ClientVolant (fichier .txt) ---------- */
WIDGETS.mesure=function(root,cfg){
  root.innerHTML=`<h4>${cfg.titre||"Outil : lire une mesure ClientVolant"}</h4>
  <p style="font-size:15px;margin:0 0 8px">${cfg.intro||"Si tu as enregistré ta mesure en fichier texte, charge-la ici pour lire les valeurs plus facilement. Sinon, lis-les directement dans ClientVolant."}</p>
  <div class="ctl"><label>Fichier de mesure (.txt)<input type="file" accept=".txt,.csv"></label><label>Courbe affichée<select></select></label></div>
  ${cfg.sample?`<p style="margin:0 0 8px"><button class="btn sm alt" type="button" data-sample>Charger la mesure d'exemple</button></p>`:""}
  <svg class="wsvg" viewBox="0 0 720 300" role="img" aria-label="Courbe de mesure"></svg>
  <div class="ctl"><label>Début de la zone : <b data-o="a">—</b><input type="range" data-r="a" min="0" max="1000" value="${cfg.za||600}"></label><label>Fin de la zone : <b data-o="b">—</b><input type="range" data-r="b" min="0" max="1000" value="${cfg.zb||1000}"></label></div>
  <div class="read"><div>Valeur au début de la zone<b data-o="ya">—</b></div><div>Valeur à la fin de la zone<b data-o="yb">—</b></div><div>Valeur moyenne sur la zone<b data-o="m">—</b></div><div>Pente sur la zone (variation par seconde)<b data-o="p">—</b></div></div>`;
  const q=x=>root.querySelector(x),sel=q("select"),svg=q("svg");let cols=[],data=[];
  q("input[type=file]").addEventListener("change",e=>{const fl=e.target.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>load(String(rd.result));rd.readAsText(fl,"ISO-8859-1");});
  if(cfg.sample)q("[data-sample]").addEventListener("click",()=>{const s=SAMPLES[cfg.sample];load(s.head+"\n"+s.rows);});
  function load(t){
    const L=t.split(/\r?\n/).filter(l=>l.trim());let hi=L.findIndex(l=>/temps/i.test(l));if(hi<0)hi=0;
    cols=L[hi].split(";").map(s=>s.trim()).filter(Boolean);
    data=L.slice(hi+1).map(l=>l.split(";").map(s=>Number(s.replace(",",".")))).filter(r=>r.length>=2&&isFinite(r[0]));
    const keep=cols.map((c,i)=>i).filter(i=>i>0&&data.some(r=>r[i]!==data[0][i]));
    sel.innerHTML=keep.map(i=>`<option value="${i}">${cols[i]}</option>`).join("");
    const pref=keep.find(i=>new RegExp(cfg.pref||"Position","i").test(cols[i]));if(pref!=null)sel.value=pref;
    draw();
  }
  function draw(){
    if(!data.length){svg.innerHTML=`<text x="360" y="150" text-anchor="middle" font-size="15" fill="#6B7F8C">Aucune mesure chargée</text>`;return;}
    const c=+sel.value,T=data.map(r=>r[0]),Y=data.map(r=>r[c]);
    const t0=T[0],t1=T[T.length-1];let y0=Math.min(0,...Y),y1=Math.max(0,...Y);const pd=(y1-y0)*.06||1;y0-=pd;y1+=pd;
    const X=t=>60+(t-t0)/(t1-t0)*640,YY=v=>270-(v-y0)/(y1-y0)*250;
    const ia=Math.round(+q('[data-r=a]').value/1000*(T.length-1)),ib=Math.round(+q('[data-r=b]').value/1000*(T.length-1));
    const a=Math.min(ia,ib),b=Math.max(ia,ib);
    let g="";const st=(y1-y0)/5;for(let k=0;k<=5;k++){const v=y0+k*st;g+=`<line x1="60" x2="700" y1="${YY(v)}" y2="${YY(v)}" stroke="#D4DEDE"/><text x="54" y="${YY(v)+4}" font-size="11" text-anchor="end" fill="#6B7F8C">${fr(v,1)}</text>`;}
    for(let k=0;k<=10;k++){const t=t0+k*(t1-t0)/10;g+=`<line x1="${X(t)}" x2="${X(t)}" y1="20" y2="270" stroke="#E6EDED"/><text x="${X(t)}" y="288" font-size="11" text-anchor="middle" fill="#6B7F8C">${fr(t,2)} s</text>`;}
    svg.innerHTML=`<rect x="${X(T[a])}" y="20" width="${Math.max(1,X(T[b])-X(T[a]))}" height="250" fill="#FCF1C9"/>${g}<line x1="60" x2="700" y1="${YY(0)}" y2="${YY(0)}" stroke="#15324B"/>
    <polyline fill="none" stroke="#2C6E7F" stroke-width="2" points="${T.map((t,i)=>X(t).toFixed(1)+","+YY(Y[i]).toFixed(1)).join(" ")}"/><text x="64" y="16" font-size="13" font-weight="600" fill="#15324B">${cols[c]}</text>`;
    const zt=T.slice(a,b+1),zy=Y.slice(a,b+1),n=zt.length,mt=zt.reduce((s,v)=>s+v,0)/n,my=zy.reduce((s,v)=>s+v,0)/n;
    let sxy=0,sxx=0;for(let i=0;i<n;i++){sxy+=(zt[i]-mt)*(zy[i]-my);sxx+=(zt[i]-mt)**2;}
    q('[data-o=a]').textContent=fr(T[a],3)+" s";q('[data-o=b]').textContent=fr(T[b],3)+" s";
    q('[data-o=ya]').textContent=fr(Y[a],1);q('[data-o=yb]').textContent=fr(Y[b],1);
    q('[data-o=m]').textContent=fr(my,1);q('[data-o=p]').textContent=sxx?fr(sxy/sxx,1)+" /s":"—";
  }
  sel.addEventListener("change",draw);root.querySelectorAll("input[type=range]").forEach(r=>r.addEventListener("input",draw));draw();
};

/* ---------- Modèle en deux phases (démarrage accéléré puis vitesse constante) ---------- */
WIDGETS.deuxphases=function(root,cfg){
  const u=cfg.u,uv=cfg.uv;
  root.innerHTML=`<h4>${cfg.titre||"Simulateur : modèle en deux phases"}</h4>
  <p style="font-size:15px;margin:0 0 6px">${cfg.intro||""}</p>
  <div class="ctl"><label>Vitesse en régime établi (${uv})<input type="text" inputmode="decimal" data-i="V" value="${cfg.V}"></label>
  <label>Durée du démarrage t<sub>d</sub> (s)<input type="text" inputmode="decimal" data-i="td" value="${cfg.td}"></label>
  <label>${cfg.labCible||"Position à atteindre"} (${u})<input type="text" inputmode="decimal" data-i="cible" value="${cfg.cible}"></label></div>
  ${cfg.overlay?`<div class="ctl"><label>Superposer ta mesure ClientVolant (.txt, facultatif)<input type="file" accept=".txt,.csv" data-f></label></div>`:""}
  <div class="two"><svg class="wsvg" data-s="v" viewBox="0 0 360 250" role="img" aria-label="Vitesse en fonction du temps"></svg><svg class="wsvg" data-s="x" viewBox="0 0 360 250" role="img" aria-label="Position en fonction du temps"></svg></div>
  <div class="read"><div>Accélération pendant le démarrage<b data-o="a">—</b></div><div>Parcouru pendant le démarrage<b data-o="x1">—</b></div><div>Instant où la ${cfg.labCibleCourt||"position"} est atteinte<b data-o="tc">—</b></div></div>`;
  const q=x=>root.querySelector(x);let meas=null;
  if(cfg.overlay)q("[data-f]").addEventListener("change",e=>{const fl=e.target.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{const L=String(rd.result).split(/\r?\n/).filter(l=>l.trim());const hi=L.findIndex(l=>/temps/i.test(l));const cols=L[hi].split(";").map(s=>s.trim());const ic=cols.findIndex(c=>/position volant/i.test(c));if(ic<0)return;meas=L.slice(hi+1).map(l=>l.split(";").map(Number)).filter(r=>isFinite(r[0])).map(r=>[r[0],Math.abs(r[ic])]);draw();};rd.readAsText(fl,"ISO-8859-1");});
  function draw(){
    const V=nb(q('[data-i=V]').value),td=nb(q('[data-i=td]').value),cb=nb(q('[data-i=cible]').value);
    if(!(V>0)||!(td>=0)||!(cb>0))return;
    const a=td>0?V/td:Infinity,x1=V*td/2,tc=cb<=x1?Math.sqrt(2*cb/a):td+(cb-x1)/V;
    const tm=cfg.tmax||Math.max(tc*1.15,td*4),xf=t=>t<td?0.5*a*t*t:x1+V*(t-td),vf=t=>t<td?a*t:V;
    const xm=Math.max(xf(tm),meas?Math.max(...meas.filter(p=>p[0]<=tm).map(p=>p[1])):0)*1.08;
    const X=t=>46+t/tm*300,Yv=v=>215-v/(V*1.2)*190,Yx=x=>215-x/xm*190;
    const ax=(Y,top,lab,f)=>{let g="";for(let k=0;k<=4;k++){const v=top*k/4;g+=`<line x1="46" x2="346" y1="${Y(v)}" y2="${Y(v)}" stroke="#D4DEDE"/><text x="42" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="#6B7F8C">${fr(v,f)}</text>`;}
      for(let k=0;k<=5;k++){const t=tm*k/5;g+=`<text x="${X(t)}" y="232" font-size="10" text-anchor="middle" fill="#6B7F8C">${fr(t,2)}</text>`;}
      return g+`<text x="50" y="16" font-size="12" font-weight="600" fill="#15324B">${lab}</text><text x="346" y="246" font-size="10" text-anchor="end" fill="#6B7F8C">t (s)</text>`;};
    const N=120,pts=f=>Array.from({length:N+1},(_,i)=>{const t=tm*i/N;return [t,f(t)];});
    q('[data-s=v]').innerHTML=ax(Yv,V*1.2,"vitesse ("+uv+")",cfg.fv||1)+`<rect x="${X(0)}" y="25" width="${X(td)-X(0)}" height="190" fill="#FCF1C9"/><polyline fill="none" stroke="#2C6E7F" stroke-width="2.5" points="${pts(vf).map(p=>X(p[0]).toFixed(1)+","+Yv(p[1]).toFixed(1)).join(" ")}"/>`;
    q('[data-s=x]').innerHTML=ax(Yx,xm,cfg.labX||("position ("+u+")"),cfg.fx||0)+
      (meas?`<polyline fill="none" stroke="#C2362B" stroke-width="2" stroke-dasharray="4 3" points="${meas.filter(p=>p[0]<=tm).map(p=>X(p[0]).toFixed(1)+","+Yx(p[1]).toFixed(1)).join(" ")}"/>`:"")+
      `<polyline fill="none" stroke="#2C6E7F" stroke-width="2.5" points="${pts(xf).map(p=>X(p[0]).toFixed(1)+","+Yx(p[1]).toFixed(1)).join(" ")}"/>
      <line x1="${X(tc)}" x2="${X(tc)}" y1="${Yx(cb)}" y2="215" stroke="#E9B10A" stroke-dasharray="3 3"/><circle cx="${X(tc)}" cy="${Yx(cb)}" r="5" fill="#E9B10A" stroke="#15324B"/>`+
      (meas?`<text x="340" y="205" font-size="11" text-anchor="end" fill="#C2362B">- - mesure</text>`:"");
    const okq=(cfg.need||[]).every(id=>{const v=S.ans[id];return v!=null&&v!==""&&(typeof v!=="object"||Object.values(v).some(x=>String(x).trim()!==""));});
    if(!okq){["a","x1","tc"].forEach(k=>q('[data-o='+k+']').innerHTML='<span style="font-size:14px;font-weight:400">après les questions '+cfg.needLab+'</span>');return;}
    q('[data-o=a]').textContent=fr(a,cfg.fa||2)+" "+cfg.ua;q('[data-o=x1]').textContent=fr(x1,cfg.fx1||2)+" "+u;q('[data-o=tc]').textContent=fr(tc,3)+" s";
  }
  root.querySelectorAll("[data-i]").forEach(i=>i.addEventListener("input",draw));draw();
  document.addEventListener("input",e=>{if(!root.contains(e.target))draw();});document.addEventListener("change",e=>{if(!root.contains(e.target))draw();});
};

/* ---------- Tracé x(t) à partir des relevés + régression linéaire ---------- */
WIDGETS.regx=function(root,cfg){
  root.innerHTML=`<h4>Outil : tracer x(t) et trouver la vitesse</h4>
  <p style="font-size:15px;margin:0 0 8px">L'outil reprend les instants que tu as saisis à la question ${cfg.qnum}. Il trace la position de la tige en fonction du temps et la droite qui passe au plus près des points (droite de régression). Sa <b>pente</b> est la vitesse de la tige.</p>
  <button class="btn sm" type="button" data-go>Tracer avec mes mesures</button>
  <svg class="wsvg" viewBox="0 0 720 300" style="margin-top:10px" role="img" aria-label="Position de la tige en fonction du temps"></svg>
  <div class="read"><div>Pente de la droite (vitesse)<b data-o="p">—</b></div><div>Ordonnée à l'origine<b data-o="b">—</b></div><div>Équation de la droite<b data-o="e">—</b></div></div>`;
  const q=x=>root.querySelector(x),svg=q("svg");
  function draw(){
    const v=S.ans[cfg.q]||{},P=[[0,0]];
    cfg.pos.forEach(p=>{const t=nb(v[p.id]);if(isFinite(t))P.push([t,p.x]);});
    if(P.length<3){svg.innerHTML=`<text x="360" y="150" text-anchor="middle" font-size="15" fill="#6B7F8C">Saisis d'abord au moins deux instants à la question ${cfg.qnum}.</text>`;return;}
    const n=P.length,mt=P.reduce((s,p)=>s+p[0],0)/n,mx=P.reduce((s,p)=>s+p[1],0)/n;let sxy=0,sxx=0;P.forEach(p=>{sxy+=(p[0]-mt)*(p[1]-mx);sxx+=(p[0]-mt)**2;});
    const k=sxy/sxx,b0=mx-k*mt,tm=Math.max(...P.map(p=>p[0]))*1.1,xm=0.275;
    const X=t=>60+t/tm*640,Y=x=>270-x/xm*250;let g="";
    for(let x=0;x<=0.25001;x+=0.05)g+=`<line x1="60" x2="700" y1="${Y(x)}" y2="${Y(x)}" stroke="#D4DEDE"/><text x="54" y="${Y(x)+4}" font-size="11" text-anchor="end" fill="#6B7F8C">${fr(x,2)}</text>`;
    for(let i=0;i<=8;i++){const t=tm*i/8;g+=`<text x="${X(t)}" y="288" font-size="11" text-anchor="middle" fill="#6B7F8C">${fr(t,1)} s</text>`;}
    svg.innerHTML=g+`<text x="64" y="16" font-size="13" font-weight="600" fill="#15324B">x (m)</text><line x1="${X(0)}" y1="${Y(b0)}" x2="${X(tm)}" y2="${Y(b0+k*tm)}" stroke="#E9B10A" stroke-width="2.5"/>`+P.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="5" fill="#2C6E7F" stroke="#15324B"/>`).join("");
    q('[data-o=p]').textContent=fr(k,4)+" m/s";q('[data-o=b]').textContent=fr(b0,4)+" m";
    q('[data-o=e]').textContent="x(t) = "+fr(k,4)+"·t "+(b0<0?"− ":"+ ")+fr(Math.abs(b0),4);
  }
  q("[data-go]").addEventListener("click",draw);draw();
};


buildPanels();refreshTabs();applyLock();tick();show(S.tab||"accueil");
setInterval(tick,1000);
})();
</script>
